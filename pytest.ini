# =============================================================================
# GENERALIZED NOTATION NOTATION (GNN) - Pytest Configuration
# =============================================================================
# Comprehensive pytest configuration for the GNN pipeline testing framework
# Last Updated: 2026-01-21
# Pytest Version: >= 7.0.0
# =============================================================================

[pytest]

# =============================================================================
# TEST DISCOVERY AND COLLECTION
# =============================================================================

# Primary test directories
testpaths =
    tests

# Test file patterns
python_files =
    test_*.py
    *_test.py

# Test class and function patterns
python_classes =
    Test*
    *Tests
    *TestCase

python_functions =
    test_*

# Directories to ignore during collection
norecursedirs =
    .venv
    venv
    __pycache__
    .pytest_cache
    node_modules
    .git
    build
    dist
    output
    cache
    temp
    tmp

# =============================================================================
# TEST EXECUTION SETTINGS
# =============================================================================

# Core pytest options for consistent behavior
addopts =
    --strict-markers
    --strict-config
    --tb=short
    --durations=10
    --durations-min=1.0
    # maxfail canonical definition: 10 is the single suite-wide default for
    # plain `pytest` runs. Runner scripts pass their own `--maxfail=` on the
    # CLI, which overrides addopts (later flag wins) — intentional, documented
    # differences only: fast/reliable subsets use lower abort thresholds
    # (tests/run_fast_tests.py and tests/test_runner_modes.py use 5 and 3 to
    # bound the fast CI lane; tests/categories.py uses per-category
    # max_failures of 6/8/10/15 consumed by tests/infrastructure/test_runner.py
    # and utils.py). No other maxfail values should be introduced.
    --maxfail=10
    -p no:randomly
    -p no:sugar
    -p no:stepwise

# Minimum pytest version requirement
minversion = 7.0

# =============================================================================
# TEST TIMEOUTS AND PERFORMANCE
# =============================================================================

# Global timeout settings
# Limitation: timeout_method=thread cannot interrupt C extensions or blocking
# subprocess waits. Long-running pipeline tests are bounded by the outer 600s
# CI wrapper instead; switching to SIGALRM would break C-ext tests mid-flight.
timeout = 300
timeout_method = thread

# Asyncio: strict mode (default). All async tests in the suite (tests/api/
# test_api_endpoints.py, tests/gui/test_websocket_bridge.py, tests/llm/
# test_llm_pipeline_model_wiring.py — 6 total) carry explicit
# @pytest.mark.asyncio markers and there are no async fixtures, so auto mode
# (which silently collects unmarked async tests) was dropped.
asyncio_default_fixture_loop_scope = function

# =============================================================================
# TEST MARKERS
# =============================================================================

markers =
    fast: Fast tests that complete in under 1 second
    slow: Slow tests that may take significant time
    unit: Unit tests for individual functions
    integration: Integration tests across modules
    pipeline: Pipeline infrastructure tests
    uv: UV package manager tests
    main_orchestrator: Main-pipeline orchestrator tests (gnn.main surface)
    jax_stack: JAX + Optax + Flax + pymdp stack validation (core package integrity) JAX + Optax + Flax + pymdp stack validation (core package integrity)
    mcp: MCP audit tests that require module discovery
    performance: Performance and resource usage tests
    core: Core module tests
    recovery: Pipeline recovery tests
    ollama: Ollama daemon-dependent LLM tests (real inference against a local Ollama server)
    env_heavy: Environment-heavy tests that invoke uv sync (venv mutation / resolution risk)
    # S2-17: external-toolchain gates are declared statically as needs_* markers
    # and resolved dynamically by tests/helpers/toolchain_probes.py via
    # tests/conftest.py. Every needs_* item is auto-tagged ``toolchain`` at
    # collection, so the default suite (-m "not ... not toolchain") deselects
    # it, and a bare run of the file skips it when the toolchain is missing.
    # The marker<->probe pairing is pinned by tests/test_zero_skip_contracts.py.
    toolchain: External-toolchain-gated tests, auto-applied by tests/conftest.py to every needs_* test, plus direct uv-subprocess tests; excluded from the default suite
    needs_julia: Julia binary required (skipped when not on PATH)
    needs_torch: PyTorch required (torch extra)
    needs_cpomdp: cpomdp required (cpomdp extra)
    needs_julia_env: committed RxInfer/ActiveInference Julia project environments must be instantiated (implies needs_julia)
    needs_lean: fep_lean checkout, lake binary, and bridge verify-document op required
    needs_cmdstan: cmdstanpy plus a compiled CmdStan toolchain required (stan extra)
    needs_pkl: pkl CLI required for native-eval parser tests (skipped when not on PATH)
    needs_sklearn: scikit-learn required (ml-ai extra)
    needs_distributed: dask.distributed required (scaling extra)
    needs_d2: D2 visualizer module must be importable
    needs_d2_cli: d2 system binary required (implies needs_d2)
    needs_pymdp: JAX + inferactively-pymdp dev stack must pass the integrity probe
    needs_ollama: a local Ollama daemon must answer model-list requests
    needs_nonroot: non-root POSIX user required for permission-based probes
    needs_posix: POSIX platform required (process-group kill tests skip elsewhere)

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Log file path is under the root output/ tree and covered by the `*.log`
# gitignore rule, so test runs leave `git status` clean. Kept out of tracked
# dirs on purpose; delete this file block if a per-run debug log is unwanted.
log_file = output/2_tests_output/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# =============================================================================
# WARNING FILTERS
# =============================================================================
filterwarnings =
    # SC-26 ratchet: deprecation classes FAIL the suite instead of being
    # swallowed suite-wide. Fixes go to the in-repo deprecated API usage,
    # not back into this list — do not re-add blanket ignores.
    error::DeprecationWarning
    error::PendingDeprecationWarning
    error::FutureWarning
    # S2-13 UserWarning triage (2026-09-10, sklearn 1.8.0 enumeration): the
    # in-repo sklearn call sites (ml_integration/processor.py training path,
    # execute/validator.py dependency probe) emit zero UserWarnings — both
    # tests/ml_integration and tests/analysis pass `-W error::UserWarning`
    # with `-o filterwarnings=` showing an empty warnings summary. The suite's
    # only other UserWarning (matplotlib "No artists with labels found to put
    # in legend" from the rxinfer visualizer) was fixed at its call site
    # (analysis/rxinfer/analyzer.py guards ax.legend() on empty axes), so no
    # UserWarning ignore remains. A new UserWarning appearing suite-wide is a
    # fresh actionable finding: fix the call site, or add a message-targeted
    # one-line filter with justification — never a blanket ignore.
    # JAX emits this RuntimeWarning when a process that has imported JAX forks
    # (ProcessPoolExecutor on Linux). The forked child workers here run trivial
    # non-JAX scripts, so the deadlock warning is a benign environment artifact.
    ignore:os\.fork\(\) was called\. os\.fork\(\) is incompatible with multithreaded code:RuntimeWarning

# =============================================================================
# USAGE EXAMPLES
# =============================================================================
#
# Run all tests:
#   pytest
#
# Run only fast tests:
#   pytest -m fast
#
# Run with coverage:
#   pytest --cov=gnn --cov-report=html
#
# Debug failing tests:
#   pytest -xvs --pdb
# =============================================================================