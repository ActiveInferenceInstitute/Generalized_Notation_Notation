# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 15
    rebase-strategy: auto
    commit-message:
      prefix: "deps(pip)"
    labels:
      - dependencies
      - python
    groups:
      pip-dependencies:
        patterns:
          - "*"

    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: "UTC"
    rebase-strategy: auto
    commit-message:
      prefix: "deps(actions)"
    labels:
      - dependencies
      - github-actions
    groups:
      # codeql init and analyze must move together: analyzing with a different
      # version than the one that wrote the configuration file fails the job.
      codeql-action:
        patterns:
          - "github/codeql-action*"
    cooldown:
      default-days: 7
