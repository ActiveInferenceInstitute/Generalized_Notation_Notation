name: Pair pin freshness

# Nightly content-and-ancestry freshness gate for the two committed pair
# pins (BC-12, scope-comp-consumers section 5.3): each pinned companion
# revision must remain ancestor-or-equal of the companion repository's
# default-branch HEAD, and the FEP bridge pair must also still match its
# recorded GNN owner digests.
#
# The paired-revision workflows (`fep-lean-paired-revision.yml`,
# `geo-infer-interchange.yml`) check out the companions at their *pinned*
# revisions and prove the bridge/interchange surfaces still agree with this
# checkout; they cannot notice that a companion default branch has moved
# ahead of its pin. This gate closes exactly that gap:
#
#   - both pair files are validated (slug + 40-hex revision),
#   - each companion is checked out at its default branch with full
#     history (`fetch-depth: 0`) so ancestry is decidable,
#   - scripts/check_pair_pin_freshness.py asserts ancestor-or-equal,
#   - the FEP source pin's GNN owner digests are recomputed against this
#     checkout; any mismatch exits 2 with the owner, recorded digest and
#     actual digest, so a green nightly cannot hide content drift.
#
# The check is git-only (stdlib + git), so the runner's system python3 is
# used deliberately and the job needs no Python setup step.
#
# Scheduled freshness checks are watchdogs, not redundant per-ref
# executions: `cancel-in-progress: false` keeps a manual dispatch from
# cancelling the nightly signal mid-run (deliberate deviation from the
# SPEC's aggressive cancellation default).
#
# What this proves and does NOT prove (evidence-plane discipline): a green
# run proves the pins name commits inside each companion default branch's
# history AND that every GNN owner digest in the FEP source pin matches this
# checkout. It does NOT prove native compilation, Q7 execution or release
# acceptance; those remain the paired workflows' job. The optional "at most
# N commits behind" lag bound from section 5.3 is intentionally not enforced
# here: the measured lag is reported in the summary and receipts, but
# ancestry and owner content are the contract.

on:
  push:
    tags: ["v[0-9]*"]
  schedule:
    # Nightly, offset from the other scheduled jobs (custody-re-render
    # runs daily at 07:14 UTC).
    - cron: "23 5 * * *"
  workflow_dispatch:

concurrency:
  group: pair-pin-freshness-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pair-pin-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gnn
          persist-credentials: false

      - name: Check out FEP_Formal default branch with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ActiveInferenceInstitute/fep_formal
          path: fep-lean
          fetch-depth: 0
          persist-credentials: false

      - name: Check out GEO_INFER default branch with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ActiveInferenceInstitute/GEO_INFER
          path: geo-infer
          fetch-depth: 0
          persist-credentials: false

      - name: Record both checkouts and the committed pins
        run: |
          mkdir receipts
          git -C gnn rev-parse HEAD > receipts/gnn-revision.txt
          git -C fep-lean rev-parse HEAD > receipts/fep-lean-revision.txt
          git -C geo-infer rev-parse HEAD > receipts/geo-infer-revision.txt
          cp gnn/.github/fep-lean-pair.json receipts/fep-lean-pair.json
          cp gnn/.github/gnn-pair.json receipts/gnn-pair.json
          cp fep-lean/specs/gnn-bridge-w2-source-custody/source-pin.json receipts/fep-source-pin.json

      - name: Assert pair pins and bound owner content are fresh
        run: |
          python3 gnn/scripts/check_pair_pin_freshness.py \
            --check gnn/.github/fep-lean-pair.json fep-lean \
            --check gnn/.github/gnn-pair.json geo-infer \
            --source-pin fep-lean/specs/gnn-bridge-w2-source-custody/source-pin.json \
            --gnn-root gnn \
            --receipts-dir receipts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pair-pin-freshness
          path: receipts/
          if-no-files-found: error
          retention-days: 14
