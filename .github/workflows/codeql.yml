name: CodeQL

on:
  push:
    tags: ["v[0-9]*"]
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  schedule:
    - cron: "28 4 * * 1"
  workflow_dispatch:

concurrency:
  # A superseded PR head is not evidence about the new head, so PR runs cancel
  # in progress. A merged tree's verdict is evidence, so main and manual runs
  # never cancel; keying those by commit keeps each tip's run independent
  # instead of queueing it behind an earlier tip's run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    env:
      UV_PYTHON: "3.14"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Database must be initialized before dependency install (advanced setup).
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          # No build tracing: the traced walk of the expanded dependency set
          # (bnlearn/pgmpy landed 2026-09-07) pushed extraction past the
          # hosted-runner limit. `none` is the supported build mode for Python.
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Match exact uv 0.13.6 in uv.toml and the Docker bootstrap.
          version: "0.13.6"
          enable-cache: true

      - name: Install dependencies (matches CI)
        run: uv sync --frozen --extra dev

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
