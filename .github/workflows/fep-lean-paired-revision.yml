name: Paired fep_formal revision

# GNN-side paired-revision CI (roadmap item GNN-04), mirroring GEO_INFER's
# `.github/workflows/gnn-interchange.yml` mechanism exactly:
#
#   - the companion revision is recorded in a committed pin file
#     (`.github/fep-lean-pair.json`, same format as GEO's `.github/gnn-pair.json`),
#   - the pin is validated (known repository slug, 40-hex revision),
#   - the companion is checked out at exactly the pinned SHA,
#   - both revisions plus the pin are retained as receipts, and
#   - the read-only fep_formal bridge surface runs against this checkout.
#
# GNN 5.0 uses the current GNN source and the exact pinned FEP companion.
# Historical 4.2.1/4.3.0 fixed-baseline policy bytes are archived under
# docs/releases; they cannot admit a current release through this workflow.
# Pair qualification requires these current-source bridge/Q7 checks to pass.
# Native proof, generated-runner execution and release acceptance remain separate.

on:
  push:
    tags: ["v[0-9]*"]
    branches: ["main"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fep-lean-paired-revision-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fep-lean-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/fep-lean/.venv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gnn
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read pinned companion revision
        id: pair
        working-directory: gnn
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          pair = json.loads(Path('.github/fep-lean-pair.json').read_text())
          assert pair['repository'] == 'ActiveInferenceInstitute/fep_formal'
          assert re.fullmatch('[0-9a-f]{40}', pair['revision'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + pair['revision'] + '\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ActiveInferenceInstitute/fep_formal
          ref: ${{ steps.pair.outputs.revision }}
          path: fep-lean
          persist-credentials: false
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Match the independently pinned FEP project requirement. This job
          # installs only FEP; GNN is a read-only source/contract checkout.
          version: "0.13.0"
          enable-cache: true
      - name: Record both checkouts before installing
        run: |
          mkdir receipts
          git -C gnn rev-parse HEAD > receipts/gnn-revision.txt
          git -C fep-lean rev-parse HEAD > receipts/fep-lean-revision.txt
          cp gnn/.github/fep-lean-pair.json receipts/pair.json
      - name: Runtime custody negative controls
        run: python gnn/.github/test_fep_paired_runtime.py -v
      - name: Install independent frozen runtime
        run: |
          uv --version > receipts/uv-version.txt
          uv sync --project fep-lean --frozen --python "$UV_PYTHON"
      # Read-only bridge surface only: `status` and `emit --check` inspect
      # source bytes and emitted-document digests and never write to either
      # checkout (verified against the selected bridge CLI at the exact companion pin).
      - name: Bound runtime status and finite/continuous bridge checks
        run: |
          set -euo pipefail
          for stage in installed status finite continuous final; do
            uv run --project fep-lean --frozen --no-sync --python "$UV_PYTHON" \
              python gnn/.github/fep_paired_runtime.py "$stage" \
              --expected-python "$UV_PYTHON" \
              --environment "$UV_PROJECT_ENVIRONMENT" \
              --gnn-root "$GITHUB_WORKSPACE/gnn" \
              --gnn-revision "${{ github.event.pull_request.head.sha || github.sha }}" \
              --fep-root "$GITHUB_WORKSPACE/fep-lean" \
              --fep-revision "${{ steps.pair.outputs.revision }}" \
              --receipts "$GITHUB_WORKSPACE/receipts"
          done
      - name: Current-source Q7 provenance and scaffold freshness
        if: matrix.python == '3.14'
        run: |
          uv run --project fep-lean --frozen --no-sync --python "$UV_PYTHON" \
            python gnn/.github/fep_paired_runtime.py q7-source \
            --expected-python "$UV_PYTHON" \
            --environment "$UV_PROJECT_ENVIRONMENT" \
            --gnn-root "$GITHUB_WORKSPACE/gnn" \
            --gnn-revision "${{ github.event.pull_request.head.sha || github.sha }}" \
            --fep-root "$GITHUB_WORKSPACE/fep-lean" \
            --fep-revision "${{ steps.pair.outputs.revision }}" \
            --receipts "$GITHUB_WORKSPACE/receipts"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: paired-fep-lean-revision-py${{ matrix.python }}
          path: receipts/
          if-no-files-found: error
          retention-days: 14
