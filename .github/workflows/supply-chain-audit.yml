# Scheduled audit of the resolved lockfile (complements Dependabot + dependency-review on PRs).
name: Supply chain audit

on:
  push:
    tags: ["v[0-9]*"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: supply-chain-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  pip-audit:
    name: pip-audit (core dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Match exact uv 0.13.4 in uv.toml and the Docker bootstrap.
          version: "0.13.4"
          enable-cache: true

      - name: Export requirements (hashed, no project line)
        run: |
          set -euo pipefail
          uv export --frozen --no-dev --no-emit-project -o /tmp/requirements-audit.txt

      # Audit the frozen export for this interpreter/platform (markers apply).
      # Preserve uv overrides (Gradio/Pillow); no advisories are ignored.
      - name: Run pip-audit
        id: audit
        run: |
          set -euo pipefail
          uv tool run --python 3.14 pip-audit -r /tmp/requirements-audit.txt --no-deps --disable-pip --require-hashes --vulnerability-service osv --desc on

      - name: Summary
        if: always()
        run: |
          {
            echo "### pip-audit (core)"
            echo ""
            echo "- Outcome: **${{ steps.audit.outcome }}**"
            echo "- Lockfile export: \`/tmp/requirements-audit.txt\` (generated in prior step)"
          } >> "$GITHUB_STEP_SUMMARY"

  pip-audit-all-extras:
    name: pip-audit (all optional extras, no dev)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Match exact uv 0.13.4 in uv.toml and the Docker bootstrap.
          version: "0.13.4"
          enable-cache: true

      - name: Export requirements
        run: |
          set -euo pipefail
          uv export --frozen --all-extras --no-dev --no-emit-project -o /tmp/requirements-all-extras.txt

      # Audit the frozen export for this interpreter/platform (markers apply).
      # Preserve uv overrides (Gradio/Pillow); no advisories are ignored.
      - name: Run pip-audit
        id: audit
        run: |
          set -euo pipefail
          uv tool run --python 3.12 pip-audit -r /tmp/requirements-all-extras.txt --no-deps --disable-pip --require-hashes --vulnerability-service osv --desc on

      - name: Summary
        if: always()
        run: |
          {
            echo "### pip-audit (all extras, no dev)"
            echo ""
            echo "- Outcome: **${{ steps.audit.outcome }}**"
          } >> "$GITHUB_STEP_SUMMARY"
