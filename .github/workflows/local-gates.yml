name: Local gates

# Gates that were previously runnable only by hand via `just` and wired
# into no workflow (found in the 2026-09-07 local/CI parity audit):
#   - just tokens       (manuscript token/citation integrity)
#   - just hydrated-prose (SC-22 PR-time guard: hydrated prose vs token map)
#   - just skills-health (MCP tool + SKILL.md resolvability)
#   - just import-linter (import boundary contracts)
#   - just thin-orchestrators (numbered orchestrator line caps)
#   - just flag-parity (CLI flags vs maintained-doc mentions)
#   - just dep-hygiene (optional-dependency consumers + stale mypy overrides)
#   - just validate-surface (validate_gnn* public surface audit)
#   - just doc-patterns (except-Exception ratchet, --strict; also in ci.yml + docs-audit.yml)
#
# Deliberately NOT wired here: `just gridworld` — since 2026-09-19 the recipe
# runs the full GridWorld pipeline end-to-end (local Julia toolchains) and
# then validates `scripts/check_pomdp_gridworld_outputs.py output`. The
# run-tree is volatile (docs/development/output_tracking.md); the separate
# weekly/manual gridworld.yml provisions its toolchains and checks fresh output.

on:
  push:
    tags: ["v[0-9]*"]
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: local-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.14"
      # Only PRs may inherit byte-identical drift. Main/manual runs stay strict.
      GNN_MANUSCRIPT_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Match exact uv 0.13.4 in uv.toml and the Docker bootstrap.
          version: "0.13.4"
          enable-cache: true

      - name: Install dependencies (dev)
        run: uv sync --frozen --extra dev

      - name: Manuscript token audit
        run: uv run --frozen --no-sync python scripts/check_manuscript_tokens.py --strict

      # SC-22 PR-time drift guard: the committed hydrated prose must be what
      # the committed token map hydrates to. A PR that regenerated the map
      # without the full ritual (figures -> template stage_03_render ->
      # record) fails here instead of in custody-re-render.yml after merge.
      - name: Hydrated prose matches token map
        run: uv run --frozen --no-sync python scripts/check_hydrated_prose.py

      - name: Manuscript figure freshness
        run: uv run --frozen --no-sync python -m pytest tests/test_manuscript_figure_freshness.py -q -p no:cacheprovider

      - name: MCP + skills resolvability health gate
        run: uv run --frozen --no-sync python scripts/check_mcp_skills_health.py --strict

      - name: Import-linter boundaries
        run: uv run --frozen --no-sync lint-imports

      - name: Thin orchestrator line cap
        run: uv run --frozen --no-sync python scripts/check_thin_orchestrators.py

      - name: CLI flag parity
        run: uv run --frozen --no-sync python scripts/check_flag_parity.py

      - name: Dependency hygiene
        run: uv run --frozen --no-sync python scripts/check_dep_hygiene.py

      - name: Validate surface audit
        run: uv run --frozen --no-sync python scripts/audit_validate_surface.py

      - name: Doc path reference gate
        run: uv run --frozen --no-sync python scripts/check_doc_path_references.py

      - name: Doc pattern ratchet
        run: uv run --frozen --no-sync python scripts/check_gnn_doc_patterns.py --strict
