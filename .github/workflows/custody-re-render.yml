name: Custody re-render

# SC-22 residual: a scheduled/manual CI run confirms the custody chain on a
# fresh render. The committed PDF evidence (output/pdf/_combined_manuscript.*)
# is produced by the docxology/template render stage (see
# manuscript/05_reproducibility.md §"Reproducible by command" and
# scripts/z_record_manuscript_render_manifest.py's docstring): the render stage
# lives in the template checkout, with this repository checked out inside it
# as a real directory at `projects/active/GeneralizedNotationNotation` (the
# template's analysis-read custody refuses a symlinked project, and its web
# renderer rejects relative links into `projects/`). This workflow reproduces that
# documented ritual (scripts/z_generate_manuscript_variables.py's docstring —
# regenerate → rebuild figures → stage_03_render → record manifest) in CI and
# then re-proves the whole chain against HEAD: the strict token gate, the
# render-custody manifest record, and tests/test_manuscript_latex_log.py.
#
# Report-only: nothing is committed back. The rendered artifacts, the custody
# manifest and the producer receipt are uploaded as run receipts, and a red
# run is the drift signal — it means the committed chain no longer describes
# HEAD (re-run the manual SC-22 ritual locally and commit, as today).
#
# The template checkout is taken at its default branch head, matching a
# developer's sibling checkout; this run is what detects template drift.

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
  schedule:
    # Daily 07:14 UTC — does not collide with the 04:28/06:00 crons.
    - cron: "14 7 * * *"

concurrency:
  group: custody-re-render-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  custody-re-render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      UV_PYTHON: "3.14"
    defaults:
      run:
        # Every repository step runs in this checkout, which lives inside the
        # template exactly where the render stage expects a project.
        working-directory: template/projects/active/GeneralizedNotationNotation
    steps:
      - name: Check out the docxology/template render stage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: docxology/template
          path: template
          persist-credentials: false

      - name: Check out this repository inside the template at projects/active/
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: template/projects/active/GeneralizedNotationNotation
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Match exact uv 0.13.4 in uv.toml and the Docker bootstrap.
          version: "0.13.4"
          enable-cache: true

      # Toolchain parity with the local ritual: pandoc 3.11 + crossref
      # v0.3.25 (the committed PDF evidence was rendered WITH pandoc-crossref
      # — its absence in CI degraded the reproduction silently). texlive-
      # bibtex-extra supplies bibtex/xelatex helpers texlive-latex-extra omits.
      - name: Install pandoc (pinned via pandoc/actions)
        uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1.1.1

      - name: Install LaTeX (xelatex, bibtex) and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-bibtex-extra \
            texlive-fonts-recommended lmodern

      - name: Install pandoc-crossref v0.3.25 (pinned)
        run: |
          # v0.3.25 matches the local ritual's pandoc-crossref; official
          # Linux release asset is a tar.xz (no crossref package in apt).
          curl -fsSL -o /tmp/cr.tar.xz \
            https://github.com/lierdakil/pandoc-crossref/releases/download/v0.3.25/pandoc-crossref-Linux-X64.tar.xz
          echo "2319816e3545ee78e44e4a97c2174c72eedf4b51d436b32721b48f43458eb0f6  /tmp/cr.tar.xz" | sha256sum --check -
          mkdir -p /tmp/cr && tar -xJf /tmp/cr.tar.xz -C /tmp/cr
          sudo install -m 0755 "$(find /tmp/cr -type f -name pandoc-crossref | head -1)" /usr/local/bin/pandoc-crossref
          pandoc-crossref --version

      - name: Install dependencies (dev)
        run: uv sync --frozen --extra dev

      - name: Install template's locked runtime
        working-directory: template
        run: uv sync --frozen

      # SC-22 ritual step 2: the render pipeline verifies figures but does
      # not rebuild them (infrastructure.rendering.pipeline's verify_figures).
      - name: Rebuild manuscript figures
        run: uv run --extra dev python -m scripts.manuscript_build_figures

      # SC-22 ritual steps 3+1: the render launcher exports TEMPLATE_REPO_ROOT
      # and re-invokes scripts/z_generate_manuscript_variables.py with this
      # checkout's .venv (infrastructure.rendering._manuscript_source).
      - name: Render the manuscript PDF (template stage_03_render)
        id: render
        working-directory: template
        run: |
          uv run --frozen python scripts/pipeline/stage_03_render.py \
            --project GeneralizedNotationNotation

      # Fresh-vs-committed custody gate: compare the render this checkout
      # just produced against the manifest as committed, BEFORE the record
      # step overwrites it — the red run is the drift signal. [FAIL] means
      # the committed chain is stale for HEAD (an artifact is missing, or
      # artifacts and inputs both drifted — rerun the whole SC-22 ritual
      # locally and commit); [WARN] is artifact-only drift with the
      # recorded inputs fully matching, i.e. toolchain variance.
      - name: Verify fresh render against committed custody manifest
        run: uv run --extra dev python scripts/z_verify_fresh_render.py

      - name: Record render custody manifest
        run: uv run --extra dev python scripts/z_record_manuscript_render_manifest.py

      - name: Manuscript token audit (strict)
        run: uv run --extra dev python scripts/check_manuscript_tokens.py --strict

      - name: Render custody + LaTeX log evidence tests
        run: uv run --extra dev python -m pytest tests/test_manuscript_latex_log.py -q -p no:cacheprovider

      - name: Collect receipts
        if: always()
        run: |
          receipts="$GITHUB_WORKSPACE/receipts"
          mkdir -p "$receipts"
          git -C "$GITHUB_WORKSPACE/template" rev-parse HEAD > "$receipts/template-revision.txt"
          git rev-parse HEAD > "$receipts/gnn-revision.txt"
          printf '%s\n' '${{ steps.render.outcome }}' > "$receipts/render-outcome.txt"
          # Preserve actual render outputs even when strict comparison correctly
          # rejects a stale committed chain. Renewal still requires verification,
          # a normal artifact commit and the unchanged strict repository gates.
          mkdir -p "$receipts/render-output"
          for directory in data figures manuscript pdf; do
            if [ -d "output/$directory" ]; then
              cp -R "output/$directory" "$receipts/render-output/"
            fi
          done
          cp output/data/manuscript_render_manifest.json "$receipts/"
          cp output/data/manuscript_variables.json "$receipts/"
          cp output/data/manuscript_variables_receipt.json "$receipts/"
          cp output/pdf/_combined_manuscript.log "$receipts/"
          cp output/pdf/_combined_manuscript.tex "$receipts/"
          cp output/pdf/_combined_manuscript.md "$receipts/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: custody-re-render-receipts
          path: receipts/
          if-no-files-found: error
          retention-days: 14
