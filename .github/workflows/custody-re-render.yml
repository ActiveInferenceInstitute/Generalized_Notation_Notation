name: Custody re-render

# Check the committed PDF, browser pages and slide decks before rebuilding.
# The floating template checkout is a drift canary. Release renewals use the
# declared template revision and explicitly record a new custody manifest.
# On a permitted CI profile, the fresh comparison checks the reproducible
# intermediates and reports any engine-specific exclusions by name.

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
  schedule:
    # Daily 07:14 UTC — does not collide with the 04:28/06:00 crons.
    - cron: "14 7 * * *"

concurrency:
  group: custody-re-render-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  custody-re-render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      UV_PYTHON: "3.14"
    defaults:
      run:
        # Every repository step runs in this checkout, which lives inside the
        # template exactly where the render stage expects a project.
        working-directory: template/projects/active/GeneralizedNotationNotation
    steps:
      - name: Check out the docxology/template render stage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: docxology/template
          path: template
          persist-credentials: false

      - name: Check out this repository inside the template at projects/active/
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: template/projects/active/GeneralizedNotationNotation
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Match exact uv 0.13.6 in uv.toml and the Docker bootstrap.
          version: "0.13.6"
          enable-cache: true

      # Toolchain parity with the local ritual, pinned to the versions the
      # committed chain is recorded with. These two are pinned rather than
      # tolerated because pandoc writes the .tex the custody gate compares on
      # this host. Without a version input the action installs the latest
      # release, which is how this job drifted to an unrecorded pandoc.
      # texlive-bibtex-extra supplies bibtex/xelatex helpers texlive-latex-extra
      # omits; the TeX Live version itself (2023 via apt) is the one axis the
      # gate declares and excludes, as the header explains.
      - name: Install pandoc 3.13 (pinned via pandoc/actions)
        uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1.1.1
        with:
          version: "3.13"

      - name: Install LaTeX (xelatex, bibtex) and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-bibtex-extra \
            texlive-fonts-recommended lmodern poppler-utils

      - name: Install pandoc-crossref v0.3.26 (pinned)
        run: |
          # v0.3.26 matches the local ritual's pandoc-crossref, which the
          # committed chain is recorded with; the official Linux release asset
          # is a tar.xz (no crossref package in apt).
          curl -fsSL -o /tmp/cr.tar.xz \
            https://github.com/lierdakil/pandoc-crossref/releases/download/v0.3.26/pandoc-crossref-Linux-X64.tar.xz
          echo "83d09646629234dfcd3d267e28184f46b9d468e98508efb3542b014634bfe999  /tmp/cr.tar.xz" | sha256sum --check -
          mkdir -p /tmp/cr && tar -xJf /tmp/cr.tar.xz -C /tmp/cr
          sudo install -m 0755 "$(find /tmp/cr -type f -name pandoc-crossref | head -1)" /usr/local/bin/pandoc-crossref
          pandoc-crossref --version

      - name: Install dependencies (dev)
        run: uv sync --frozen --extra dev

      - name: Install template's locked runtime
        working-directory: template
        run: uv sync --frozen

      - name: Verify committed publication custody
        run: uv run --frozen --no-sync python scripts/z_verify_fresh_render.py --committed-only

      - name: Manuscript token audit (strict)
        run: uv run --frozen --no-sync python scripts/check_manuscript_tokens.py --strict

      - name: Render custody and LaTeX log evidence tests
        run: uv run --frozen --no-sync python -m pytest tests/test_manuscript_latex_log.py -q -p no:cacheprovider

      - name: Export the observed template revision and source date
        working-directory: template
        run: |
          echo "GNN_TEMPLATE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Rebuild manuscript figures
        run: uv run --frozen --no-sync python -m scripts.manuscript_build_figures

      - name: Render the manuscript PDF, HTML, and slides (template Stage 03)
        id: render
        working-directory: template
        run: |
          uv run --frozen --no-sync python scripts/pipeline/stage_03_render.py \
            --project GeneralizedNotationNotation

      - name: Prepare rendered evidence for validation
        run: uv run --frozen --no-sync python scripts/z_record_manuscript_render_manifest.py --prepare

      - name: Validate the fresh publication (template Stage 04)
        id: validate
        working-directory: template
        run: |
          uv run --frozen --no-sync python scripts/pipeline/stage_04_validate.py \
            --project GeneralizedNotationNotation

      - name: Verify fresh render against the committed custody manifest
        run: uv run --frozen --no-sync python scripts/z_verify_fresh_render.py

      - name: Collect receipts
        if: always()
        run: |
          receipts="$GITHUB_WORKSPACE/receipts"
          mkdir -p "$receipts"
          git -C "$GITHUB_WORKSPACE/template" rev-parse HEAD > "$receipts/template-revision.txt"
          git rev-parse HEAD > "$receipts/gnn-revision.txt"
          printf '%s\n' '${{ steps.render.outcome }}' > "$receipts/render-outcome.txt"
          printf '%s\n' '${{ steps.validate.outcome }}' > "$receipts/validation-outcome.txt"
          git show HEAD:output/data/manuscript_render_manifest.json > "$receipts/committed-custody-manifest.json"
          if [ '${{ steps.render.outcome }}' != skipped ]; then
            mkdir -p "$receipts/render-output"
            for directory in data figures manuscript pdf reports slides web; do
              if [ -d "output/$directory" ]; then
                cp -R "output/$directory" "$receipts/render-output/"
              fi
            done
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: custody-re-render-receipts
          path: receipts/
          if-no-files-found: error
          retention-days: 14
