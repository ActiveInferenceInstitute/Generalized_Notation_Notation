name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false
    env:
      PYTHONPATH: src
      PYTHONHASHSEED: "0"
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Pin uv to the Dockerfile bootstrap floor series (UV_VERSION=0.12.0).
          version: "0.12"
          enable-cache: true

      - name: Install dependencies (dev)
        run: uv sync --frozen --extra dev

      - name: Validate JAX + PyMDP stack (core)
        run: |
          uv run --extra dev python -c "from gnn.utils.runtime_safety.jax_stack_validation import verify_jax_pymdp_stack; verify_jax_pymdp_stack(); print('jax_stack_ok')"

      - name: Ruff format check
        if: matrix.python-version == '3.12'
        run: uv run --extra dev ruff format --check src scripts

      - name: Ruff check
        if: matrix.python-version == '3.12'
        run: uv run --extra dev ruff check src/gnn scripts

      - name: Repository terminology audit
        if: matrix.python-version == '3.12'
        run: uv run --extra dev python scripts/check_repo_terminology.py --strict

      - name: Maintained documentation terminology audit
        if: matrix.python-version == '3.12'
        run: uv run --extra dev python scripts/check_maintained_doc_terms.py --strict

      - name: Documentation audit
        if: matrix.python-version == '3.12'
        run: uv run --extra dev python docs/development/docs_audit.py --strict --check-anchors --no-write

      - name: Documentation contract audit
        if: matrix.python-version == '3.12'
        run: uv run --extra dev python scripts/check_doc_contracts.py --strict

      - name: GNN documentation pattern audit
        if: matrix.python-version == '3.12'
        run: uv run --extra dev python scripts/check_gnn_doc_patterns.py --strict

      - name: Import-linter boundaries
        if: matrix.python-version == '3.12'
        run: uv run --extra dev lint-imports

      - name: Thin orchestrator line cap
        if: matrix.python-version == '3.12'
        run: uv run --extra dev python scripts/check_thin_orchestrators.py

      - name: CLI flag parity
        if: matrix.python-version == '3.12'
        run: uv run --extra dev python scripts/check_flag_parity.py

      - name: Dependency hygiene
        if: matrix.python-version == '3.12'
        run: uv run --extra dev python scripts/check_dep_hygiene.py

      - name: Validate surface audit
        if: matrix.python-version == '3.12'
        run: uv run --extra dev python scripts/audit_validate_surface.py

      - name: Capability contracts
        if: matrix.python-version == '3.12'
        run: uv run --extra dev python scripts/check_capability_contracts.py --strict

      - name: Functional MCP and capability PR gate
        if: matrix.python-version == '3.12'
        run: |
          uv run --extra dev python -m pytest \
            tests/mcp/test_mcp_functional.py \
            tests/mcp/test_mcp_http_auth.py \
            tests/mcp/test_transport_reliability.py \
            tests/render/test_framework_availability.py \
            tests/docs/test_capability_contracts.py \
            -q --tb=short -rs --junitxml=junit/mcp-capabilities.xml

      - name: MCP and capability test evidence
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-capabilities
          path: junit/mcp-capabilities.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Mypy type check
        if: matrix.python-version == '3.12'
        run: uv run --extra dev mypy src/gnn --show-error-codes

      - name: Pytest collect-only
        if: matrix.python-version == '3.12'
        run: |
          uv run --extra dev python -m pytest --collect-only tests/ -q --tb=no \
            -m "not ollama"

      - name: Focused PyMDP/POMDP tests
        if: matrix.python-version == '3.12'
        run: |
          uv run --extra dev python -m pytest \
            tests/execute/test_pymdp_contracts.py \
            tests/execute/test_discrete_models_pymdp.py \
            tests/visualization/test_visualization_matrices.py \
            -q --tb=short

      - name: Run unit and integration tests (parallel, skip pipeline & MCP)
        id: pytest
        run: |
          mkdir -p junit
          uv run --extra dev python -m pytest -m "not pipeline and not mcp and not ollama and not env_heavy and not toolchain" \
            --tb=short \
            -q \
            -n auto --dist worksteal \
            --cov=gnn --cov-report=term-missing --cov-report=json:junit/coverage-${{ matrix.python-version }}.json \
            --junitxml=junit/pytest-${{ matrix.python-version }}.xml

      - name: Pytest JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-junit-${{ matrix.python-version }}
          path: junit/pytest-${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Coverage report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.python-version }}
          path: junit/coverage-${{ matrix.python-version }}.json
          if-no-files-found: warn
          retention-days: 14

      - name: Test job summary
        if: always()
        run: |
          {
            echo "### Tests (Python ${{ matrix.python-version }})"
            echo ""
            echo "Outcome: **${{ steps.pytest.outcome }}**"
            echo ""
            echo "JUnit XML is attached as artifact \`pytest-junit-${{ matrix.python-version }}\` when present."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: v3 orchestration acceptance gate
        if: matrix.python-version == '3.12'
        run: |
          PYTHONPATH=src uv run --extra dev python scripts/run_v3_orchestration_acceptance.py --strict

  extras:
    # PR-time gate for the 12 environment-skipped tests (11 sklearn cases in
    # test_ml_integration_inference.py + 1 torch execution case in
    # test_continuous_renderers.py). Without this job they only run in the
    # weekly scheduled full-extras workflow. See TO-DO.md MIN-T1.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONPATH: src
      PYTHONHASHSEED: "0"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Pin uv to the Dockerfile bootstrap floor series (UV_VERSION=0.12.0).
          version: "0.12"
          enable-cache: true

      - name: Install dependencies (dev + ml-ai + torch)
        run: uv sync --frozen --extra dev --extra ml-ai --extra torch

      - name: Extras-unlock tests (skipped by the dev-only default env)
        run: |
          uv run --extra dev --extra ml-ai --extra torch python -m pytest \
            tests/ml_integration/test_ml_integration_inference.py \
            tests/render/test_continuous_renderers.py \
            -q --tb=short

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.12"
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Pin uv to the Dockerfile bootstrap floor series (UV_VERSION=0.12.0).
          version: "0.12"
          enable-cache: true

      - name: Install dependencies (dev)
        run: uv sync --frozen --extra dev

      - name: Run Bandit scan (medium+ findings fail)
        id: bandit
        continue-on-error: true
        run: |
          uv run --extra dev bandit -r src/gnn -c pyproject.toml \
            --severity-level medium \
            --confidence-level medium \
            -f sarif \
            -o bandit-results.sarif

      - name: Upload Bandit SARIF to code scanning
        if: always() && hashFiles('bandit-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      - name: Upload Bandit SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-results
          path: bandit-results.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if Bandit reported issues
        if: steps.bandit.outcome == 'failure'
        run: exit 1
