name: CI

on:
  push:
    tags: ["v[0-9]*"]
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  schedule:
    # Weekly full ordinary matrix on the current main tip. Pull requests run
    # the full matrix at their own head; branch pushes to main run the
    # deterministic post-merge subset defined on the individual jobs below.
    - cron: "17 6 * * 6"
  workflow_dispatch:

concurrency:
  # A superseded PR head is not evidence about the new head, so PR runs cancel
  # in progress. A merged tree's verdict is evidence, so main, tag and
  # scheduled runs never cancel; keying those by commit keeps each tip's run
  # independent instead of queueing it behind an earlier tip's run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    # Full matrix on pull requests, schedules, manual dispatch and version
    # tags. A branch push to main runs only the deterministic subset below.
    if: github.event_name != 'push' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.14", "3.11", "3.13"]
      fail-fast: false
    env:
      PYTHONPATH: src
      PYTHONHASHSEED: "0"
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Match exact uv 0.13.6 in uv.toml and the Docker bootstrap.
          version: "0.13.6"
          enable-cache: true

      - name: Install dependencies (dev)
        run: ./run.sh sync

      - name: Validate JAX + PyMDP stack (core)
        run: |
          uv run --frozen --no-sync python -c "from gnn.utils.runtime_safety.jax_stack_validation import verify_jax_pymdp_stack; verify_jax_pymdp_stack(); print('jax_stack_ok')"

      - name: Run unit and integration tests (parallel, skip pipeline & MCP)
        id: pytest
        run: |
          mkdir -p junit
          ./run.sh coverage \
            --cov-report=json:junit/coverage-${{ matrix.python-version }}.json \
            --junitxml=junit/pytest-${{ matrix.python-version }}.xml

      - name: Pytest JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-junit-${{ matrix.python-version }}
          path: junit/pytest-${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Coverage report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.python-version }}
          path: junit/coverage-${{ matrix.python-version }}.json
          if-no-files-found: warn
          retention-days: 14

      - name: Test job summary
        if: always()
        run: |
          {
            echo "### Tests (Python ${{ matrix.python-version }})"
            echo ""
            echo "Outcome: **${{ steps.pytest.outcome }}**"
            echo ""
            echo "JUnit XML is attached as artifact \`pytest-junit-${{ matrix.python-version }}\` when present."
          } >> "$GITHUB_STEP_SUMMARY"

  pytest312:
    name: pytest (3.12)
    # The full 3.12 unit suite runs with the rest of the full matrix; branch
    # pushes to main keep only the deterministic subset (quality + contracts +
    # security) and defer the unit suite to the weekly schedule.
    if: github.event_name != 'push' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      PYTHONPATH: src
      PYTHONHASHSEED: "0"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Match exact uv 0.13.6 in uv.toml and the Docker bootstrap.
          version: "0.13.6"
          enable-cache: true

      - name: Install dependencies (dev)
        run: uv sync --frozen --extra dev

      - name: Validate JAX + PyMDP stack (core)
        run: |
          uv run --frozen --no-sync python -c "from gnn.utils.runtime_safety.jax_stack_validation import verify_jax_pymdp_stack; verify_jax_pymdp_stack(); print('jax_stack_ok')"

      - name: Run unit and integration tests (parallel, skip pipeline & MCP)
        id: pytest
        run: |
          mkdir -p junit
          ./run.sh coverage \
            --cov-report=json:junit/coverage-3.12.json \
            --junitxml=junit/pytest-3.12.xml

      - name: Pytest JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-junit-3.12
          path: junit/pytest-3.12.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Coverage report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-3.12
          path: junit/coverage-3.12.json
          if-no-files-found: warn
          retention-days: 14

      - name: Test job summary
        if: always()
        run: |
          {
            echo "### Tests (Python 3.12)"
            echo ""
            echo "Outcome: **${{ steps.pytest.outcome }}**"
            echo ""
            echo "JUnit XML is attached as artifact \`pytest-junit-3.12\` when present."
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: quality (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      PYTHONPATH: src
      PYTHONHASHSEED: "0"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Match exact uv 0.13.6 in uv.toml and the Docker bootstrap.
          version: "0.13.6"
          enable-cache: true

      - name: Ruff format and lint checks
        run: ./run.sh lint

      # Deterministic documentation checks, including the offline importer
      # registry check, have one owner: ./run.sh docs in docs-audit.yml.
      - name: Functional MCP and capability PR gate
        run: ./run.sh contracts --junitxml=junit/mcp-capabilities.xml

      - name: MCP and capability test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-capabilities
          path: junit/mcp-capabilities.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Mypy type check
        run: ./run.sh type

      - name: v3 orchestration acceptance gate
        run: ./run.sh acceptance

  test312:
    # Preserve the required status while independent checks run in parallel.
    # `always()` keeps a genuinely failed prerequisite failing this gate. The
    # added `!cancelled()` skips the guard only when the run itself was
    # cancelled — a superseded push — so the late-scheduled guard no longer
    # records a permanent "cancelled != success" failure on the merge commit.
    # Do NOT relax the assertions to accept `cancelled`: a prerequisite can be
    # cancelled inside a non-cancelled run when matrix `fail-fast` cancels
    # sibling legs, and accepting that would turn a failed matrix green.
    # The event clause skips this guard on a branch push to main, where the
    # unit-matrix lanes it aggregates are deliberately not run; without it the
    # guard would see `skipped` lane results and fail the merged tree.
    name: test (3.12)
    needs: [pytest312, quality]
    if: always() && !cancelled() && (github.event_name != 'push' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTEST_RESULT: ${{ needs.pytest312.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
    steps:
      - name: Require Python 3.12 tests and quality checks
        run: |
          test "$PYTEST_RESULT" = success
          test "$QUALITY_RESULT" = success

  pipeline-contracts:
    # Deterministic orchestration contracts run on every PR and in the weekly
    # full matrix. A branch push to main keeps this lane as part of the
    # deterministic post-merge subset. Native inference, public network and
    # toolchain acceptance have separate explicit lanes.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      PYTHONHASHSEED: "0"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          check-latest: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Install deterministic contract environment
        run: uv sync --frozen --extra dev
      - name: Execute pipeline contracts
        run: |
          uv run --frozen --no-sync python -m pytest tests/ \
            -m "pipeline and not ollama and not env_heavy and (not toolchain or needs_posix)" \
            -q --tb=short -rsx --junitxml=junit/pipeline-contracts.xml
      - name: Publish contract counts and source identity
        if: always()
        run: uv run --frozen --no-sync python scripts/test_receipt.py junit/pipeline-contracts.xml
      - name: Pipeline contract evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-contracts
          path: junit/pipeline-contracts.*
          if-no-files-found: error
          retention-days: 14

  extras:
    # PR-time gate for the environment-skipped tests (11 sklearn cases in
    # test_ml_integration_inference.py, 1 torch execution case in
    # test_continuous_renderers.py, and the torch/torchlens execution and
    # capture cases in test_render_pytorch_torchlens.py). The same cases can run
    # locally with the frozen optional dependencies.
    # Full matrix only: a branch push to main defers this lane to the weekly run.
    if: github.event_name != 'push' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONPATH: src
      PYTHONHASHSEED: "0"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Match exact uv 0.13.6 in uv.toml and the Docker bootstrap.
          version: "0.13.6"
          enable-cache: true

      - name: Install dependencies (dev + ml-ai + torchlens)
        run: uv sync --frozen --extra dev --extra ml-ai --extra torchlens

      - name: Extras-unlock tests (skipped by the dev-only default env)
        run: |
          uv run --frozen --no-sync python -m pytest \
            tests/ml_integration/test_ml_integration_inference.py \
            tests/render/test_continuous_renderers.py \
            tests/render/test_render_pytorch_torchlens.py \
            -q --tb=short

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.14"
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Match exact uv 0.13.6 in uv.toml and the Docker bootstrap.
          version: "0.13.6"
          enable-cache: true

      - name: Install dependencies (dev)
        run: uv sync --frozen --extra dev

      - name: Run Bandit scan (medium+ findings fail)
        id: bandit
        continue-on-error: true
        run: |
          uv run --frozen --no-sync bandit -r src/gnn -c pyproject.toml \
            --severity-level medium \
            --confidence-level medium \
            -f sarif \
            -o bandit-results.sarif

      - name: Upload Bandit SARIF to code scanning
        if: always() && hashFiles('bandit-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      - name: Upload Bandit SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bandit-results
          path: bandit-results.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if Bandit reported issues
        if: steps.bandit.outcome == 'failure'
        run: exit 1
