name: CI

on:
  push:
    tags: ["v[0-9]*"]
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.14", "3.11", "3.13"]
      fail-fast: false
    env:
      PYTHONPATH: src
      PYTHONHASHSEED: "0"
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Match exact uv 0.13.4 in uv.toml and the Docker bootstrap.
          version: "0.13.4"
          enable-cache: true

      - name: Install dependencies (dev)
        run: uv sync --frozen --extra dev

      - name: Validate JAX + PyMDP stack (core)
        run: |
          uv run --frozen --no-sync python -c "from gnn.utils.runtime_safety.jax_stack_validation import verify_jax_pymdp_stack; verify_jax_pymdp_stack(); print('jax_stack_ok')"

      - name: Run unit and integration tests (parallel, skip pipeline & MCP)
        id: pytest
        run: |
          mkdir -p junit
          uv run --frozen --no-sync python -m pytest -m "not pipeline and not mcp and not ollama and not env_heavy and not toolchain" \
            --tb=short \
            -q \
            -n auto --dist worksteal \
            --cov=gnn --cov-report=term-missing --cov-report=json:junit/coverage-${{ matrix.python-version }}.json \
            --junitxml=junit/pytest-${{ matrix.python-version }}.xml

      - name: Pytest JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-junit-${{ matrix.python-version }}
          path: junit/pytest-${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Coverage report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.python-version }}
          path: junit/coverage-${{ matrix.python-version }}.json
          if-no-files-found: warn
          retention-days: 14

      - name: Test job summary
        if: always()
        run: |
          {
            echo "### Tests (Python ${{ matrix.python-version }})"
            echo ""
            echo "Outcome: **${{ steps.pytest.outcome }}**"
            echo ""
            echo "JUnit XML is attached as artifact \`pytest-junit-${{ matrix.python-version }}\` when present."
          } >> "$GITHUB_STEP_SUMMARY"

  pytest312:
    name: pytest (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      PYTHONPATH: src
      PYTHONHASHSEED: "0"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Match exact uv 0.13.4 in uv.toml and the Docker bootstrap.
          version: "0.13.4"
          enable-cache: true

      - name: Install dependencies (dev)
        run: uv sync --frozen --extra dev

      - name: Validate JAX + PyMDP stack (core)
        run: |
          uv run --frozen --no-sync python -c "from gnn.utils.runtime_safety.jax_stack_validation import verify_jax_pymdp_stack; verify_jax_pymdp_stack(); print('jax_stack_ok')"

      - name: Run unit and integration tests (parallel, skip pipeline & MCP)
        id: pytest
        run: |
          mkdir -p junit
          uv run --frozen --no-sync python -m pytest -m "not pipeline and not mcp and not ollama and not env_heavy and not toolchain" \
            --tb=short \
            -q \
            -n auto --dist worksteal \
            --cov=gnn --cov-report=term-missing --cov-report=json:junit/coverage-3.12.json \
            --junitxml=junit/pytest-3.12.xml

      - name: Pytest JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-junit-3.12
          path: junit/pytest-3.12.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Coverage report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-3.12
          path: junit/coverage-3.12.json
          if-no-files-found: warn
          retention-days: 14

      - name: Test job summary
        if: always()
        run: |
          {
            echo "### Tests (Python 3.12)"
            echo ""
            echo "Outcome: **${{ steps.pytest.outcome }}**"
            echo ""
            echo "JUnit XML is attached as artifact \`pytest-junit-3.12\` when present."
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: quality (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      PYTHONPATH: src
      PYTHONHASHSEED: "0"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Match exact uv 0.13.4 in uv.toml and the Docker bootstrap.
          version: "0.13.4"
          enable-cache: true

      - name: Install dependencies (dev)
        run: uv sync --frozen --extra dev

      - name: Ruff format check
        run: uv run --frozen --no-sync ruff format --check src scripts

      - name: Ruff check
        run: uv run --frozen --no-sync ruff check src/gnn scripts

      - name: Documentation contract audit
        run: uv run --frozen --no-sync python scripts/check_doc_contracts.py --strict

      - name: Capability contracts
        run: uv run --frozen --no-sync python scripts/check_capability_contracts.py --strict

      - name: Functional MCP and capability PR gate
        run: |
          uv run --frozen --no-sync python -m pytest \
            tests/mcp/test_mcp_functional.py \
            tests/mcp/test_mcp_http_auth.py \
            tests/mcp/test_transport_reliability.py \
            tests/render/test_framework_availability.py \
            tests/docs/test_capability_contracts.py \
            -q --tb=short -rs --junitxml=junit/mcp-capabilities.xml

      - name: MCP and capability test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-capabilities
          path: junit/mcp-capabilities.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Mypy type check
        run: uv run --frozen --no-sync mypy src/gnn .github/release_gate.py --show-error-codes

      - name: Pytest collect-only
        run: |
          uv run --frozen --no-sync python -m pytest --collect-only tests/ -q --tb=no \
            -m "not ollama"

      - name: v3 orchestration acceptance gate
        run: |
          PYTHONPATH=src uv run --frozen --no-sync python scripts/run_v3_orchestration_acceptance.py --strict

  test312:
    # Preserve the required status while independent checks run in parallel.
    name: test (3.12)
    needs: [pytest312, quality]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTEST_RESULT: ${{ needs.pytest312.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
    steps:
      - name: Require Python 3.12 tests and quality checks
        run: |
          test "$PYTEST_RESULT" = success
          test "$QUALITY_RESULT" = success

  pipeline-contracts:
    # Deterministic orchestration contracts run on every PR. Native inference,
    # public network and toolchain acceptance have separate explicit lanes.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      PYTHONHASHSEED: "0"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          check-latest: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true
      - name: Install deterministic contract environment
        run: uv sync --frozen --extra dev
      - name: Execute pipeline contracts
        run: |
          uv run --frozen --no-sync python -m pytest tests/ \
            -m "pipeline and not ollama and not env_heavy and (not toolchain or needs_posix)" \
            -q --tb=short -rsx --junitxml=junit/pipeline-contracts.xml
      - name: Publish contract counts and source identity
        if: always()
        run: uv run --frozen --no-sync python scripts/test_receipt.py junit/pipeline-contracts.xml
      - name: Pipeline contract evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-contracts
          path: junit/pipeline-contracts.*
          if-no-files-found: error
          retention-days: 14

  extras:
    # PR-time gate for the 12 environment-skipped tests (11 sklearn cases in
    # test_ml_integration_inference.py + 1 torch execution case in
    # test_continuous_renderers.py). Without this job they only run in the
    # weekly scheduled full-extras workflow. The optional-dependency lane remains mandatory.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONPATH: src
      PYTHONHASHSEED: "0"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Match exact uv 0.13.4 in uv.toml and the Docker bootstrap.
          version: "0.13.4"
          enable-cache: true

      - name: Install dependencies (dev + ml-ai + torch)
        run: uv sync --frozen --extra dev --extra ml-ai --extra torch

      - name: Extras-unlock tests (skipped by the dev-only default env)
        run: |
          uv run --frozen --no-sync python -m pytest \
            tests/ml_integration/test_ml_integration_inference.py \
            tests/render/test_continuous_renderers.py \
            -q --tb=short

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.14"
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Match exact uv 0.13.4 in uv.toml and the Docker bootstrap.
          version: "0.13.4"
          enable-cache: true

      - name: Install dependencies (dev)
        run: uv sync --frozen --extra dev

      - name: Run Bandit scan (medium+ findings fail)
        id: bandit
        continue-on-error: true
        run: |
          uv run --frozen --no-sync bandit -r src/gnn -c pyproject.toml \
            --severity-level medium \
            --confidence-level medium \
            -f sarif \
            -o bandit-results.sarif

      - name: Upload Bandit SARIF to code scanning
        if: always() && hashFiles('bandit-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      - name: Upload Bandit SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bandit-results
          path: bandit-results.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if Bandit reported issues
        if: steps.bandit.outcome == 'failure'
        run: exit 1
