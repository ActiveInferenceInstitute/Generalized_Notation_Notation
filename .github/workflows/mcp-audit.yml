name: MCP audit
on:
  push:
    tags: ["v[0-9]*"]
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: mcp-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mcp-tool-count:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.14"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          check-latest: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Match exact uv 0.13.6 in uv.toml and the Docker bootstrap.
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      # MCP_TOOL_FLOOR lives in tests/mcp/test_mcp_audit.py — single source of
      # truth shared with the justfile mcp-count gate. This dedicated job is the
      # sole MCP tool-count gate in CI: the duplicate step in ci.yml (removed,
      # S2-23) ran the same assertion inline without artifact/receipt handling.
      - name: MCP tool count audit
        run: |
          uv run --frozen --no-sync python -c "from tests.mcp.test_mcp_audit import count_mcp_tools, MCP_TOOL_FLOOR; count = count_mcp_tools(); print(f'MCP tool count: {count}'); assert count >= MCP_TOOL_FLOOR, f'MCP tool count {count} is below the floor {MCP_TOOL_FLOOR}'; print('OK')"
