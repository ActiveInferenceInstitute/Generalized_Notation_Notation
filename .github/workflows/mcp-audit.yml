name: MCP audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: mcp-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mcp-tool-count:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Pin uv to the Dockerfile bootstrap floor series (UV_VERSION=0.12.0).
          version: "0.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      # MCP_TOOL_FLOOR lives in tests/mcp/test_mcp_audit.py — single source of
      # truth shared with the justfile mcp-count gate. This dedicated job is the
      # sole MCP tool-count gate in CI: the duplicate step in ci.yml (removed,
      # S2-23) ran the same assertion inline without artifact/receipt handling.
      - name: MCP tool count audit
        run: |
          uv run --extra dev python -c "from tests.mcp.test_mcp_audit import count_mcp_tools, MCP_TOOL_FLOOR; count = count_mcp_tools(); print(f'MCP tool count: {count}'); assert count >= MCP_TOOL_FLOOR, f'MCP tool count {count} is below the floor {MCP_TOOL_FLOOR}'; print('OK')"