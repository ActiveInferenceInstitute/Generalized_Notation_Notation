name: Docs audit

# Single owner of deterministic documentation and terminology checks on every change.

# Documentation contracts depend on source and metadata as well as Markdown.
on:
  push:
    tags: ["v[0-9]*"]
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Scheduled so external-link rot is caught without per-PR network flakiness.
    - cron: "0 6 * * 1"

  workflow_dispatch:
    inputs:
      external_links:
        description: Run the external-link audit and retain all observations
        type: boolean
        default: false
concurrency:
  group: docs-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Match exact uv 0.13.4 in uv.toml and the Docker bootstrap.
          version: "0.13.4"
          enable-cache: true

      - name: Install dependencies (dev)
        run: uv sync --frozen --extra dev

      - name: Exit-code documentation contract
        run: uv run --frozen --no-sync python -m pytest tests/utils/test_argument_and_dependency_contracts.py::test_exit_code_contract_docs_use_canonical_wording -q --no-cov

      - name: Documentation audit (strict)
        run: uv run --frozen --no-sync python docs/development/docs_audit.py --strict --check-anchors --no-write

      - name: Repository terminology audit
        run: uv run --frozen --no-sync python scripts/check_repo_terminology.py --strict

      - name: Maintained documentation terminology audit
        run: uv run --frozen --no-sync python scripts/check_maintained_doc_terms.py --strict

      - name: External link audit (weekly job)
        if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || inputs.external_links
        run: |
          set -euo pipefail
          uv run --frozen --no-sync python scripts/check_external_links.py --fail-on-dead \
            --allow-hosts doi.org zenodo.org | tee external-links.txt
      - name: Retain external-link observations
        if: always() && (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || inputs.external_links)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: external-link-observations
          path: external-links.txt
          if-no-files-found: error
          retention-days: 14
