name: Installed Platforms

on:
  push:
    tags: ["v[0-9]*"]
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

concurrency:
  # A superseded PR head is not evidence about the new head, so PR runs cancel
  # in progress. A merged tree's verdict is evidence, so main and manual runs
  # never cancel; keying those by commit keeps each tip's run independent
  # instead of queueing it behind an earlier tip's run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  installed:
    name: installed (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Every event runs the same lanes across the supported range.
        include:
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: macos-latest, python: "3.14"}
          - {os: windows-latest, python: "3.14"}
    env:
      UV_PYTHON: ${{ matrix.python }}
      INSTALLED_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONHASHSEED: "0"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Qualify the wheel and sdist and export frozen runtime profiles
        id: build
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, tomllib
          checkout = pathlib.Path.cwd()
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['INSTALLED_SOURCE_REVISION'], 'installed build source differs from candidate'
          scratch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gnn-installed-platform'
          scratch.mkdir()
          before = subprocess.check_output(['git', '-c', 'core.fsmonitor=false', 'status', '--porcelain', '--untracked-files=no'], text=True)
          (scratch / 'tracked-before.txt').write_text(before)
          constraints = checkout / '.github/build-requirements.txt'
          build = ['uv', 'build', '--build-constraints', str(constraints), '--require-build-hashes']
          subprocess.run([*build, '--wheel', '--out-dir', str(scratch / 'dist')], check=True)
          subprocess.run([*build, '--out-dir', str(scratch / 'rebuilt')], check=True)
          wheel, = (scratch / 'dist').glob('*.whl')
          rebuilt, = (scratch / 'rebuilt').glob('*.whl')
          sdist, = (scratch / 'rebuilt').glob('*.tar.gz')
          subprocess.run([sys.executable, str(checkout / 'scripts/check_distribution_artifacts.py'), '--wheel', str(wheel), '--rebuilt-wheel', str(rebuilt), '--sdist', str(sdist), '--receipt', str(scratch / 'distribution-acceptance.json')], check=True)
          (scratch / 'build-identity.json').write_text(json.dumps({'checkout_commit': source, 'required_backend': tomllib.loads((checkout / 'pyproject.toml').read_text(encoding='utf-8'))['build-system']['requires'], 'build_constraints_sha256': hashlib.sha256(constraints.read_bytes()).hexdigest(), 'python_version': sys.version}, indent=2), encoding='utf-8')
          subprocess.run(['uv', 'export', '--frozen', '--no-default-groups', '--extra', 'api', '--extra', 'thrml', '--no-emit-project', '--output-file', str(scratch / 'runtime.txt')], check=True, stdout=subprocess.DEVNULL)
          subprocess.run(['uv', 'export', '--frozen', '--only-group', 'dev', '--no-emit-project', '--output-file', str(scratch / 'testtools.txt')], check=True, stdout=subprocess.DEVNULL)
          subprocess.run(['uv', 'export', '--frozen', '--no-default-groups', '--no-emit-project', '--output-file', str(scratch / 'base-runtime.txt')], check=True, stdout=subprocess.DEVNULL)
          PY
      - name: Accept the distributions with an ordinary resolver
        env:
          GRADIO_ANALYTICS_ENABLED: "False"
          HF_HUB_OFFLINE: "1"
        run: |
          python - <<'PY'
          import os, pathlib, shutil, subprocess
          checkout = pathlib.Path.cwd()
          scratch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gnn-installed-platform'
          wheel, = (scratch / 'dist').glob('*.whl')
          sdist, = (scratch / 'rebuilt').glob('*.tar.gz')
          constraints = checkout / '.github/build-requirements.txt'
          for profile, package in [('wheel', wheel), ('sdist', sdist)]:
              root = scratch / ('normal-' + profile)
              root.mkdir()
              environment = root / 'venv'
              subprocess.run(['uv', 'venv', '--python', os.environ['UV_PYTHON'], str(environment)], cwd=root, check=True)
              python = environment / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
              install = ['uv', '--no-config', 'pip', 'install', '--python', str(python)]
              subprocess.run([*install, '--build-constraints', str(constraints), '--require-build-hashes', str(package)], cwd=root, check=True)
              model = root / 'static_perception.md'
              shutil.copyfile(checkout / 'input/gnn_files/basics/static_perception.md', model)
              subprocess.run([str(python), '-I', str(checkout / 'scripts/run_installed_platform_acceptance.py'), '--base-wheel', '--checkout', str(checkout), '--root', str(root), '--model', str(model), '--receipt', str(scratch / ('normal-' + profile + '.json'))], cwd=root, check=True)
              if profile == 'wheel' and os.name == 'posix':
                  subprocess.run([*install, '--dry-run', str(wheel) + '[all]'], cwd=root, check=True)
                  subprocess.run([*install, str(wheel) + '[gui]'], cwd=root, check=True)
                  subprocess.run([str(python), '-I', '-c', 'import gradio; from PIL import Image; assert callable(gradio.Blocks); Image.new("RGB", (2, 2)).save("native_gui_probe.png"); Image.open("native_gui_probe.png").verify()'], cwd=root, check=True)
          PY
      - name: Install the wheel with API, THRML and development test tools
        run: |
          python - <<'PY'
          import os, pathlib, subprocess
          scratch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gnn-installed-platform'
          subprocess.run(['uv', 'venv', '--python', os.environ['UV_PYTHON'], str(scratch / 'venv')], check=True)
          python = scratch / 'venv' / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.run(['uv', '--no-config', 'pip', 'install', '--python', str(python), '--only-binary', ':all:', '--require-hashes', '-r', str(scratch / 'runtime.txt')], cwd=scratch, check=True)
          subprocess.run(['uv', '--no-config', 'pip', 'install', '--python', str(python), '--require-hashes', '-r', str(scratch / 'testtools.txt')], cwd=scratch, check=True)
          wheel, = (scratch / 'dist').glob('*.whl')
          subprocess.run(['uv', '--no-config', 'pip', 'install', '--python', str(python), '--no-deps', str(wheel)], cwd=scratch, check=True)
          (scratch / 'python-path.txt').write_text(str(python))
          PY
      - name: Accept the installed scientific stack and public boundaries
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          checkout = pathlib.Path.cwd()
          scratch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gnn-installed-platform'
          data = scratch / 'data'
          data.mkdir()
          model = data / 'static_perception.md'
          shutil.copyfile(checkout / 'input/gnn_files/basics/static_perception.md', model)
          python = (scratch / 'python-path.txt').read_text()
          subprocess.run([python, '-I', str(checkout / 'scripts/run_installed_platform_acceptance.py'), '--checkout', str(checkout), '--root', str(data), '--model', str(model), '--receipt', str(scratch / 'acceptance.json')], cwd=data, check=True)
          wheel, = (scratch / 'dist').glob('*.whl')
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          (scratch / 'identity.json').write_text(json.dumps({'checkout_commit': source, 'wheel_sha256': hashlib.sha256(wheel.read_bytes()).hexdigest(), 'lock_sha256': hashlib.sha256((checkout / 'uv.lock').read_bytes()).hexdigest(), 'runtime_export_sha256': hashlib.sha256((scratch / 'runtime.txt').read_bytes()).hexdigest()}, indent=2))
          PY
      - name: Installed native numerical and platform boundary witnesses
        run: |
          python - <<'PY'
          import os, pathlib, shutil, subprocess, xml.etree.ElementTree as ET
          checkout = pathlib.Path.cwd()
          scratch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gnn-installed-platform'
          witness = scratch / 'witness'
          witness.mkdir()
          shutil.copytree(checkout / 'tests', witness / 'tests')
          shutil.copytree(checkout / 'input', witness / 'input')
          shutil.copyfile(checkout / 'pyproject.toml', witness / 'pyproject.toml')
          shutil.copyfile(checkout / 'pytest.ini', witness / 'pytest.ini')
          # Preserve test behavior while independently checking every imported
          # GNN module remains an installed package, including teardown imports.
          binding = witness / 'tests/conftest.py'
          with binding.open('a') as stream:
              stream.write('\n\ndef pytest_sessionfinish(session, exitstatus):\n    import pathlib, sys\n    checkout = pathlib.Path(' + repr(str(checkout)) + ')\n    for name, module in list(sys.modules.items()):\n        if (name == "gnn" or name.startswith("gnn.")) and getattr(module, "__file__", None):\n            assert not pathlib.Path(module.__file__).resolve().is_relative_to(checkout), name\n')
          python = (scratch / 'python-path.txt').read_text()
          junit = scratch / 'native-thrml.xml'
          subprocess.run([python, '-I', '-m', 'pytest', 'tests/render/test_thrml_native.py', '-q', '--tb=short', '--junitxml=' + str(junit)], cwd=witness, check=True)
          cache_junit = scratch / 'cache-publication.xml'
          subprocess.run([python, '-I', '-m', 'pytest', 'tests/llm/test_llm_cache.py', '-q', '--tb=short', '--junitxml=' + str(cache_junit)], cwd=witness, check=True)
          cache_cases = list(ET.parse(cache_junit).iter('testcase'))
          assert cache_cases and not any(case.find(kind) is not None for case in cache_cases for kind in ('skipped', 'failure', 'error')), 'installed cache publication witness skipped or failed'
          native_markers = 'not needs_posix' if os.name == 'nt' else ''
          security_junit = scratch / 'native-boundaries.xml'
          subprocess.run([python, '-I', '-m', 'pytest', 'tests/security/test_filesystem_boundaries.py', '-m', native_markers, '--override-ini', 'addopts=', '-q', '--tb=short', '--junitxml=' + str(security_junit)], cwd=witness, check=True)
          security_cases = list(ET.parse(security_junit).iter('testcase'))
          assert security_cases and not any(case.find(kind) is not None for case in security_cases for kind in ('skipped', 'failure', 'error')), 'native boundary witness skipped or failed'
          tree = ET.parse(junit)
          cases = list(tree.iter('testcase'))
          assert cases and not any(case.find(kind) is not None for case in cases for kind in ('skipped', 'failure', 'error')), 'native witness skipped or failed'
          PY
      - name: Accept the separate base wheel outside the checkout
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          checkout = pathlib.Path.cwd()
          scratch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gnn-installed-platform'
          venv = scratch / 'base-venv'
          data = scratch / 'base-data'
          data.mkdir()
          model = data / 'static_perception.md'
          shutil.copyfile(checkout / 'input/gnn_files/basics/static_perception.md', model)
          subprocess.run(['uv', 'venv', '--python', os.environ['UV_PYTHON'], str(venv)], check=True)
          python = venv / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          runtime = scratch / 'base-runtime.txt'
          wheel, = (scratch / 'dist').glob('*.whl')
          installer = ['uv', '--no-config', 'pip', 'install', '--python', str(python)]
          subprocess.run([*installer, '--only-binary', ':all:', '--require-hashes', '-r', str(runtime)], cwd=scratch, check=True)
          subprocess.run([*installer, '--no-deps', str(wheel)], cwd=scratch, check=True)
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['INSTALLED_SOURCE_REVISION'], 'base build source differs from candidate'
          (scratch / 'base-identity.json').write_text(json.dumps({'checkout_commit': source, 'wheel_sha256': hashlib.sha256(wheel.read_bytes()).hexdigest(), 'lock_sha256': hashlib.sha256((checkout / 'uv.lock').read_bytes()).hexdigest(), 'runtime_export_sha256': hashlib.sha256(runtime.read_bytes()).hexdigest()}, indent=2))
          subprocess.run([str(python), '-I', str(checkout / 'scripts/run_installed_platform_acceptance.py'), '--base-wheel', '--checkout', str(checkout), '--root', str(data), '--model', str(model), '--receipt', str(scratch / 'base-acceptance.json')], cwd=data, check=True)
          PY
      - name: Qualify separate LSP and API wheel profiles and public typing
        run: |
          python - <<'PYCODE'
          import os, pathlib, subprocess, re, tomllib
          checkout = pathlib.Path.cwd()
          scratch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gnn-installed-platform'
          wheel, = (scratch / 'dist').glob('*.whl')
          for profile in ('lsp', 'api'):
              requirements = scratch / (profile + '-runtime.txt')
              subprocess.run(['uv', 'export', '--frozen', '--no-default-groups', '--no-emit-project', '--extra', profile, '--output-file', str(requirements)], check=True, stdout=subprocess.DEVNULL)
              environment = scratch / (profile + '-venv')
              subprocess.run(['uv', 'venv', '--python', os.environ['UV_PYTHON'], str(environment)], check=True)
              python = environment / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
              subprocess.run(['uv', '--no-config', 'pip', 'install', '--python', str(python), '--only-binary', ':all:', '--require-hashes', '-r', str(requirements)], cwd=scratch, check=True)
              subprocess.run(['uv', '--no-config', 'pip', 'install', '--python', str(python), '--no-deps', str(wheel)], cwd=scratch, check=True)
              with (scratch / (profile + '-profile.log')).open('w') as log:
                  subprocess.run([str(python), '-I', str(checkout / 'tests/setup/qualify_installed_profile.py'), profile], cwd=scratch, stdout=log, stderr=subprocess.STDOUT, check=True)
          python = scratch / 'base-venv' / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          # Install only mypy's locked dependency closure into the base venv;
          # the public typing witness must retain missing API/LSP extras.
          packages = tomllib.loads((checkout / 'uv.lock').read_text())['package']
          needed = {'mypy'}
          while True:
              expanded = needed | {dep['name'] for package in packages if package['name'] in needed for dep in package.get('dependencies', [])}
              if expanded == needed:
                  break
              needed = expanded
          logical = (scratch / 'testtools.txt').read_text().replace('\\\n', '').splitlines()
          requirements = scratch / 'mypy-tools.txt'
          requirements.write_text('\n'.join(line for line in logical if (match := re.match(r'([A-Za-z0-9_.-]+)==', line)) and match[1] in needed) + '\n')
          subprocess.run(['uv', '--no-config', 'pip', 'install', '--python', str(python), '--require-hashes', '-r', str(requirements)], cwd=scratch, check=True)
          subprocess.run([str(python), '-I', '-c', "from importlib.resources import files; from importlib.util import find_spec; assert files('gnn').joinpath('py.typed').is_file(); assert find_spec('fastapi') is None; assert find_spec('pygls') is None"], cwd=scratch, check=True)
          public = scratch / 'public_imports.py'
          public.write_text('\n'.join((
              'from pathlib import Path',
              'from typing import Any, assert_type',
              'from gnn.importers import ImporterPin',
              'from gnn.parsers import GNNParsingSystem, parse_gnn_file_structured',
              'from gnn.types import GNNFormat, GNNVariable, ParseResult',
              'from gnn.validation.semantic_witness import build_semantic_witness',
              '',
              'def verify(path: Path, variable: GNNVariable, pin: ImporterPin) -> None:',
              '    assert_type(GNNParsingSystem().parse_file(path), ParseResult)',
              '    assert_type(parse_gnn_file_structured(path, GNNFormat.MARKDOWN), ParseResult)',
              '    assert_type(variable.name, str)',
              '    assert_type(pin.commit, str)',
              '    assert_type(build_semantic_witness(b"source", b"result"), dict[str, Any])',
              '',
          )), encoding='utf-8')
          misuse = scratch / 'public_misuse.py'
          misuse.write_text('from gnn.parsers import parse_gnn_file_structured\nparse_gnn_file_structured(123)\n', encoding='utf-8')
          env = {key: value for key, value in os.environ.items() if key not in {'PYTHONPATH', 'MYPYPATH'}}
          mypy = [str(python), '-I', '-m', 'mypy', '--strict', '--no-incremental', '--cache-dir', os.devnull, '--show-error-codes', '--no-color-output']
          with (scratch / 'public-mypy.log').open('w', encoding='utf-8') as log:
              subprocess.run([*mypy, str(public)], cwd=scratch, env=env, stdout=log, stderr=subprocess.STDOUT, check=True)
          result = subprocess.run([*mypy, str(misuse)], cwd=scratch, env=env, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          (scratch / 'public-mypy-negative.log').write_text(result.stdout, encoding='utf-8')
          diagnostics = [line for line in result.stdout.splitlines() if ': error:' in line]
          assert result.returncode == 1 and len(diagnostics) == 1, result.stdout
          error = diagnostics[0]
          assert 'parse_gnn_file_structured' in error and 'incompatible type "int"' in error and error.endswith('[arg-type]'), error
          PYCODE
      - name: Tracked-file bookend
        if: always()
        run: |
          python - <<'PY'
          import os, pathlib, subprocess
          scratch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gnn-installed-platform'
          actual = subprocess.check_output(['git', '-c', 'core.fsmonitor=false', 'status', '--porcelain', '--untracked-files=no'], text=True)
          (scratch / 'tracked-after.txt').write_text(actual)
          assert actual == (scratch / 'tracked-before.txt').read_text(), actual
          PY
      - name: Installed acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/gnn-installed-platform/*.json
            ${{ runner.temp }}/gnn-installed-platform/*.xml
            ${{ runner.temp }}/gnn-installed-platform/*-profile.log
            ${{ runner.temp }}/gnn-installed-platform/public-mypy*.log
            ${{ runner.temp }}/gnn-installed-platform/tracked-*.txt
            ${{ runner.temp }}/gnn-installed-platform/data/*.log
            ${{ runner.temp }}/gnn-installed-platform/base-data/*.log
          if-no-files-found: error
          retention-days: 14


  container:
    name: container (linux/amd64, 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CONTAINER_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build the frozen Docker runtime and retain identities
        run: |
          CONTAINER_RECEIPTS="$RUNNER_TEMP/gnn-container-receipts"
          echo "CONTAINER_RECEIPTS=$CONTAINER_RECEIPTS" >> "$GITHUB_ENV"
          mkdir -p "$CONTAINER_RECEIPTS"
          test "$(git rev-parse HEAD)" = "$CONTAINER_SOURCE_REVISION"
          git rev-parse HEAD > "$CONTAINER_RECEIPTS/source-revision.txt"
          sha256sum Dockerfile uv.lock uv.toml > "$CONTAINER_RECEIPTS/input-sha256.txt"
          docker build --tag "gnn-ci:$CONTAINER_SOURCE_REVISION" . > "$CONTAINER_RECEIPTS/build.log" 2>&1
          docker image inspect "gnn-ci:$CONTAINER_SOURCE_REVISION" > "$CONTAINER_RECEIPTS/image.json"
      - name: Verify the non-root runtime and public CLI boundaries
        run: |
          image="gnn-ci:$CONTAINER_SOURCE_REVISION"
          docker run --rm --entrypoint /usr/local/bin/uv "$image" --version > "$CONTAINER_RECEIPTS/uv-version.txt"
          docker run --rm --entrypoint /opt/venv/bin/python "$image" -c "import os, sys; assert os.geteuid() != 0; assert sys.version_info[:2] == (3, 14)"
          docker run --rm --entrypoint /opt/venv/bin/python "$image" -m pytest \
            tests/cli/test_native_cli_unicode_streams_410.py \
            tests/infrastructure/test_environment_python.py -q --no-cov \
            > "$CONTAINER_RECEIPTS/cli-tests.log" 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-linux-amd64-python314
          path: ${{ env.CONTAINER_RECEIPTS }}/
          if-no-files-found: error
