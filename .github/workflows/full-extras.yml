name: Full Extras (Weekly)

# Runs overnight Sunday to validate optional dependency groups (audio, gui,
# research, scaling) that are not installed by the default CI dev extra.
# These groups are not core pipeline requirements but regressions in them
# should be caught within a week.

on:
  schedule:
    - cron: "0 6 * * 0"  # Sunday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ci-full-extras-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  full-extras:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.12"]
      fail-fast: false
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Pin uv to the Dockerfile bootstrap floor series (UV_VERSION=0.12.0).
          version: "0.12"
          enable-cache: true

      - name: Install all dependencies (all-extras)
        run: uv sync --frozen --all-extras

      - name: Validate JAX + PyMDP stack
        run: |
          uv run --all-extras python -c "from gnn.utils.runtime_safety.jax_stack_validation import verify_jax_pymdp_stack; verify_jax_pymdp_stack(); print('jax_stack_ok')"

      - name: Validate optional imports (audio)
        run: |
          uv run --all-extras python -c "
          for mod in ['librosa', 'soundfile', 'pedalboard']:
              __import__(mod)
              print(f'  {mod}: OK')
          "

      # Optional-import validation must distinguish an absent distribution
      # (optional-extra gap: warn + skip, recorded in $GITHUB_STEP_SUMMARY) from
      # a real breakage: a distribution that IS installed but whose import
      # raises ImportError (e.g. a broken C-extension build) fails the step
      # with a durable summary record instead of a swallowed 'skipped' line.
      - name: Validate optional imports (gui)
        run: |
          uv run --all-extras python - <<'PY'
          import importlib.metadata
          import os
          import sys

          MODULES = ["gradio"]
          skipped: list[str] = []
          failed: list[str] = []

          for mod in MODULES:
              try:
                  importlib.metadata.version(mod)
              except importlib.metadata.PackageNotFoundError:
                  skipped.append(f"{mod}: distribution not installed (optional-extra gap)")
                  continue
              try:
                  __import__(mod)
              except ImportError as exc:
                  failed.append(f"{mod}: installed but import raised ImportError: {exc!r}")
              else:
                  print(f"  {mod}: OK")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### Optional imports (gui)\n\n")
              for line in skipped:
                  summary.write(f"- SKIPPED: {line}\n")
              for line in failed:
                  summary.write(f"- FAILED: {line}\n")
              if not skipped and not failed:
                  summary.write("- all imports OK\n")

          for line in skipped:
              print(f"::warning::{line}")
          for line in failed:
              print(f"::error::{line}")

          if failed:
              sys.exit(1)
          PY

      - name: Validate optional imports (research / scaling)
        run: |
          uv run --all-extras python - <<'PY'
          import importlib.metadata
          import os
          import sys

          MODULES = ["sympy", "numba", "dask", "distributed"]
          skipped: list[str] = []
          failed: list[str] = []

          for mod in MODULES:
              try:
                  importlib.metadata.version(mod)
              except importlib.metadata.PackageNotFoundError:
                  skipped.append(f"{mod}: distribution not installed (optional-extra gap)")
                  continue
              try:
                  __import__(mod)
              except ImportError as exc:
                  failed.append(f"{mod}: installed but import raised ImportError: {exc!r}")
              else:
                  print(f"  {mod}: OK")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### Optional imports (research / scaling)\n\n")
              for line in skipped:
                  summary.write(f"- SKIPPED: {line}\n")
              for line in failed:
                  summary.write(f"- FAILED: {line}\n")
              if not skipped and not failed:
                  summary.write("- all imports OK\n")

          for line in skipped:
              print(f"::warning::{line}")
          for line in failed:
              print(f"::error::{line}")

          if failed:
              sys.exit(1)
          PY

      - name: Run full test suite (all-extras)
        run: |
          uv run --all-extras python -m pytest tests/ -q --tb=short \
            --cov=gnn --cov-report=json:junit/coverage-full-extras.json \
            --junitxml=junit/full-extras-${{ matrix.python-version }}.xml

      - name: Pytest JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-junit-full-extras-${{ matrix.python-version }}
          path: junit/full-extras-${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::Full-extras test suite failed. Check workflow logs for details."
          {
            echo "## Full-extras run failed"
            echo ""
            echo "The scheduled Sunday all-extras run failed. Inspect the job logs and the"
            echo "\`pytest-junit-full-extras-${{ matrix.python-version }}\` artifact for evidence."
          } >> "$GITHUB_STEP_SUMMARY"