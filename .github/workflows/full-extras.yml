name: Full Extras (Weekly)

# Runs overnight Sunday to validate optional dependency groups (audio, gui,
# research, scaling) that are not installed by the default CI dev extra.
# These groups are not core pipeline requirements but regressions in them
# should be caught within a week.

on:
  push:
    tags: ["v[0-9]*"]
  schedule:
    - cron: "0 6 * * 0"  # Sunday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ci-full-extras-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  full-extras:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.12"]
      fail-fast: false
    env:
      PYTHONPATH: src
      UV_PYTHON: ${{ matrix.python-version }}
      GNN_NUMERICAL_WITNESS_DIR: junit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Match exact uv 0.13.4 in uv.toml and the Docker bootstrap.
          version: "0.13.4"
          enable-cache: true

      - name: Install all dependencies (all-extras)
        run: uv sync --frozen --all-extras

      - name: Validate JAX + PyMDP stack
        run: |
          uv run --frozen --no-sync python -c "from gnn.utils.runtime_safety.jax_stack_validation import verify_jax_pymdp_stack; verify_jax_pymdp_stack(); print('jax_stack_ok')"

      - name: Validate optional imports (audio)
        run: |
          uv run --frozen --no-sync python -c "
          for mod in ['librosa', 'soundfile', 'pedalboard']:
              __import__(mod)
              print(f'  {mod}: OK')
          "

      # Optional-import validation must distinguish an absent distribution
      # (optional-extra gap: warn + skip, recorded in $GITHUB_STEP_SUMMARY) from
      # a real breakage: a distribution that IS installed but whose import
      # raises ImportError (e.g. a broken C-extension build) fails the step
      # with a durable summary record instead of a swallowed 'skipped' line.
      - name: Validate optional imports (gui)
        run: |
          uv run --frozen --no-sync python - <<'PY'
          import importlib.metadata
          import os
          import sys

          MODULES = ["gradio"]
          skipped: list[str] = []
          failed: list[str] = []

          for mod in MODULES:
              try:
                  importlib.metadata.version(mod)
              except importlib.metadata.PackageNotFoundError:
                  skipped.append(f"{mod}: distribution not installed (optional-extra gap)")
                  continue
              try:
                  __import__(mod)
              except ImportError as exc:
                  failed.append(f"{mod}: installed but import raised ImportError: {exc!r}")
              else:
                  print(f"  {mod}: OK")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### Optional imports (gui)\n\n")
              for line in skipped:
                  summary.write(f"- SKIPPED: {line}\n")
              for line in failed:
                  summary.write(f"- FAILED: {line}\n")
              if not skipped and not failed:
                  summary.write("- all imports OK\n")

          for line in skipped:
              print(f"::warning::{line}")
          for line in failed:
              print(f"::error::{line}")

          if failed:
              sys.exit(1)
          PY

      - name: Validate optional imports (research / scaling)
        run: |
          uv run --frozen --no-sync python - <<'PY'
          import importlib.metadata
          import os
          import sys

          MODULES = ["sympy", "numba", "dask", "distributed"]
          skipped: list[str] = []
          failed: list[str] = []

          for mod in MODULES:
              try:
                  importlib.metadata.version(mod)
              except importlib.metadata.PackageNotFoundError:
                  skipped.append(f"{mod}: distribution not installed (optional-extra gap)")
                  continue
              try:
                  __import__(mod)
              except ImportError as exc:
                  failed.append(f"{mod}: installed but import raised ImportError: {exc!r}")
              else:
                  print(f"  {mod}: OK")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### Optional imports (research / scaling)\n\n")
              for line in skipped:
                  summary.write(f"- SKIPPED: {line}\n")
              for line in failed:
                  summary.write(f"- FAILED: {line}\n")
              if not skipped and not failed:
                  summary.write("- all imports OK\n")

          for line in skipped:
              print(f"::warning::{line}")
          for line in failed:
              print(f"::error::{line}")

          if failed:
              sys.exit(1)
          PY

      - name: Run full test suite (all-extras)
        run: |
          uv run --frozen --no-sync python -m pytest tests/ -q --tb=short -n auto --dist worksteal \
            --cov=gnn --cov-report=json:junit/coverage-full-extras.json \
            --junitxml=junit/full-extras-${{ matrix.python-version }}.xml

      - name: Verify independent numerical witness receipts
        run: |
          uv run --frozen --no-sync python - <<'PYCODE'
          import hashlib, json, subprocess
          from pathlib import Path
          from tests.helpers.numerical_witness import read_source, compare_records, enumerate_finite, condition_joint_gaussian, record
          from gnn.validation.semantic_witness import verify_semantic_witness
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          for model in ('finite', 'gaussian'):
              path = Path('junit') / f'e4-{model}-filtering.json'
              receipt = json.loads(path.read_text())
              assert receipt['schema'] == 'gnn-independent-numerical-witness-v1'
              assert receipt['checkout_commit'] == revision
              assert receipt['checkout_dirty_paths'] == []
              assert receipt['source_contract']['model'] == model
              source = receipt['source_utf8'].encode('utf-8')
              assert read_source(source) == receipt['source_contract']
              assert hashlib.sha256(source).hexdigest() == receipt['source_contract']['source_sha256']
              for label in ('script', 'result'):
                  assert hashlib.sha256(receipt['native'][label + '_utf8'].encode('utf-8')).hexdigest() == receipt['native'][label + '_sha256']
              result = json.loads(receipt['native']['result_utf8'])
              contract = read_source(source)
              observations = result['observations' if model == 'finite' else 'observations_continuous']
              actions = result['transition_actions'] if model == 'finite' else []
              if model == 'finite':
                  quantities = {'beliefs': enumerate_finite(contract, observations, actions)}
              else:
                  means, covariances = condition_joint_gaussian(contract, observations)
                  quantities = {'beliefs': means, 'posterior_cov': covariances}
              recomputed = record(contract, observations, actions, quantities)
              assert recomputed == receipt['expected'], 'saved reference differs from independent source recomputation'
              for quantity, values in receipt['actual']['quantities'].items():
                  assert result[quantity] == values
              assert compare_records(recomputed, receipt['actual']) == receipt['comparisons']
              assert receipt['comparisons'] and all(item['status'] == 'passed' for item in receipt['comparisons'].values())
              assert receipt['native']['framework_version']
              assert receipt['expected']['formal_evidence']['status'] == 'unavailable'
              if model == 'gaussian':
                  assert receipt['actual']['runtime_precision'] == {'array_dtype': 'float64', 'jax_enable_x64': True}
              semantic = json.loads((Path('junit') / f'e4-{model}-semantic-v2.json').read_text())
              assert semantic['schema'] == 'gnn-semantic-witness-v2'
              assert semantic['status'] == 'passed'
              assert verify_semantic_witness(semantic) == []
              assert semantic['artifacts']['source']['utf8'] == receipt['source_utf8']
              assert semantic['artifacts']['program']['utf8'] == receipt['native']['script_utf8']
              assert semantic['artifacts']['result']['utf8'] == receipt['native']['result_utf8']
          PYCODE

      - name: Record execution counts and source identity
        if: always()
        run: |
          uv run --frozen --no-sync python scripts/test_receipt.py \
            junit/full-extras-${{ matrix.python-version }}.xml

      - name: Pytest JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-junit-full-extras-${{ matrix.python-version }}
          path: |
            junit/full-extras-${{ matrix.python-version }}.*
            junit/e4-*-filtering.json
          if-no-files-found: warn
          retention-days: 14

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::Full-extras test suite failed. Check workflow logs for details."
          {
            echo "## Full-extras run failed"
            echo ""
            echo "The scheduled Sunday all-extras run failed. Inspect the job logs and the"
            echo "\`pytest-junit-full-extras-${{ matrix.python-version }}\` artifact for evidence."
          } >> "$GITHUB_STEP_SUMMARY"
