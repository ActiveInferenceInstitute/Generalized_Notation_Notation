name: Workflow Lint

on:
  push:
    tags: ["v[0-9]*"]
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/*release*"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/*release*"
  workflow_dispatch:

concurrency:
  # Keep superseded PR runs grouped by PR ref. Qualify each release phase
  # independently by event, ref, and commit.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}-{2}', github.event_name, github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: Release scheduling controls
        run: python3 -m unittest discover -s .github -p test_release_gate.py -v
