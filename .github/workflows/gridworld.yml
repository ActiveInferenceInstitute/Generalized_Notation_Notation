# Gridworld boundary check.
#
# OB-1 decision (2026-09-23): CI is now allowed to EMIT the volatile
# boundary artifacts in the runner workspace and gate on the fresh tree.
# This workflow runs the POMDP GridWorld pipeline end-to-end (the same
# command as the `just gridworld` recipe, including its exit contract:
# 0 = success, 2 = success with warnings), then hard-gates on
# scripts/check_pomdp_gridworld_outputs.py. The output/ git boundary is
# unchanged — nothing new is committed; the volatile run tree lives only
# in the runner workspace, and the pipeline execution summary is uploaded
# as a run receipt.
#
# Report-only: a red run is the drift signal — it means the committed
# pipeline + committed Julia envs no longer satisfy the published output
# contract.

name: Gridworld boundary check

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
  schedule:
    # Weekly Monday 03:43 UTC — does not collide with the
    # 04:28/05:23/06:00/07:14 crons in the other workflows.
    - cron: "43 3 * * 1"

concurrency:
  group: gridworld-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gridworld:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.12"
      JULIA_PKG_PRECOMPILE_AUTO: "0"
      JULIA_NUM_PRECOMPILE_TASKS: "2"
      GKSwstype: "100"
      OLLAMA_MODEL: "gemma3:1b"
      OLLAMA_NUM_CTX: "8192"
      OLLAMA_SEED: "42"
      GNN_LLM_BATCH_PROMPTS: "1"
      GNN_LLM_RESPONSE_WORDS: "40"
      GNN_LLM_ANSWER_MAX_CHARS: "1000"
      GNN_LLM_PROMPT_TIMEOUT: "180"
      GNN_LLM_MAX_TOKENS: "4096"
      GNN_LLM_CHUNK_BYTES: "65536"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select latest Python 3.12 patch
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          check-latest: true

      - name: Select fresh run output
        run: echo "GRIDWORLD_OUTPUT=$RUNNER_TEMP/gridworld-output" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Match exact uv 0.13.4 in uv.toml and the Docker bootstrap.
          version: "0.13.4"
          enable-cache: true

      - name: Install dependencies (dev)
        run: uv sync --frozen --extra dev

      # src/gnn/execute/julia_setup.py locates Julia with a single
      # shutil.which("julia") probe, so any Julia on PATH satisfies the
      # pipeline's executors.
      - name: Install Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.13.2"

      - name: Cache Julia package inputs
        uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-name: gnn-julia-1.13.2
          key-prefix: ${{ hashFiles('src/gnn/execute/**/Manifest.toml', 'src/gnn/execute/rxinfer/src/*.jl', 'docs/rxinfer/multiagent_trajectory_planning/Manifest.toml') }}
          delete-old-caches: 'false'
          save-always: 'true'

      - name: Instantiate and warm both required Julia environments
        run: |
          julia --startup-file=no --project=src/gnn/execute/rxinfer -e 'using Pkg; Pkg.instantiate(); using GnnRxInferModels'
          julia --startup-file=no --project=src/gnn/execute/activeinference_jl -e 'using Pkg; Pkg.instantiate(); using ActiveInference, Distributions, JSON, StatsBase'
          git diff --exit-code -- src/gnn/execute/rxinfer/Project.toml src/gnn/execute/rxinfer/Manifest.toml src/gnn/execute/activeinference_jl/Project.toml src/gnn/execute/activeinference_jl/Manifest.toml

      - name: Install and provision the required local LLM
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/ollama/ollama/releases/download/v0.40.6/ollama-linux-amd64.tar.zst \
            --output "$RUNNER_TEMP/ollama.tar.zst"
          echo "c164ab8b1b28e2a247c29719b8e404c423c5b83ae64c3ab4e59d50c7ff7fc5e0  $RUNNER_TEMP/ollama.tar.zst" | sha256sum --check
          sudo tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C /usr
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent http://localhost:11434/api/version; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          ollama pull "$OLLAMA_MODEL"
          ollama --version

      - name: Record the explicit local LLM acceptance profile
        run: |
          uv run --frozen --no-sync python - <<'PYPROFILE'
          import json
          import os
          from pathlib import Path
          keys = ["OLLAMA_MODEL", "OLLAMA_NUM_CTX", "OLLAMA_SEED",
                  "GNN_LLM_BATCH_PROMPTS", "GNN_LLM_RESPONSE_WORDS",
                  "GNN_LLM_ANSWER_MAX_CHARS", "GNN_LLM_PROMPT_TIMEOUT",
                  "GNN_LLM_MAX_TOKENS", "GNN_LLM_CHUNK_BYTES"]
          profile = {"environment": {key: os.environ[key] for key in keys},
                     "llm_timeout_seconds": 600}
          (Path(os.environ["RUNNER_TEMP"]) / "gridworld-profile.json").write_text(
              json.dumps(profile, indent=2) + "\n"
          )
          PYPROFILE

      - name: Run the POMDP GridWorld pipeline
        run: |
          set -euo pipefail
          status=0
          uv run --frozen --no-sync python src/gnn/main.py --target-dir input/gnn_files/pomdp_gridworld --output-dir "$GRIDWORLD_OUTPUT" --frameworks all --llm-timeout 600 --verbose 2>&1 | tee "$RUNNER_TEMP/gridworld.log" || status=$?
          # Thin-orchestrator exit contract (see the `just gridworld` recipe):
          # 0 = success, 2 = success with warnings.
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi
          test -s "$GRIDWORLD_OUTPUT/00_pipeline_summary/pipeline_execution_summary.json"

      - name: Gate on the POMDP GridWorld output contract
        run: uv run --frozen --no-sync python scripts/check_pomdp_gridworld_outputs.py "$GRIDWORLD_OUTPUT"

      - name: Verify frozen dependency inputs
        run: git diff --exit-code -- pyproject.toml uv.lock uv.toml src/gnn/execute/rxinfer/Project.toml src/gnn/execute/rxinfer/Manifest.toml src/gnn/execute/activeinference_jl/Project.toml src/gnn/execute/activeinference_jl/Manifest.toml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gridworld-pipeline-summary
          path: |
            ${{ env.GRIDWORLD_OUTPUT }}/00_pipeline_summary/
            ${{ env.GRIDWORLD_OUTPUT }}/2_tests_output/
            ${{ env.GRIDWORLD_OUTPUT }}/12_execute_output/
            ${{ env.GRIDWORLD_OUTPUT }}/13_llm_output/
            ${{ env.GRIDWORLD_OUTPUT }}/16_analysis_output/
            ${{ runner.temp }}/gridworld.log
            ${{ runner.temp }}/gridworld-profile.json
            ${{ runner.temp }}/ollama.log
          if-no-files-found: warn
          retention-days: 7
