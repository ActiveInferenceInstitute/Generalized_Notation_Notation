name: Manual reported native verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reported-native-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reported-native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [numpyro, rxinfer]
    env:
      GNN_NATIVE_VERIFY_SOURCE_ROOT: ${{ github.workspace }}
      GKSwstype: "100"
      JULIA_PKG_PRECOMPILE_AUTO: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.15"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"
          enable-cache: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        if: matrix.backend == 'rxinfer'
        with:
          version: "1.12.7"
      - name: Provision the frozen ordinary wheel outside checkout
        env:
          GNN_NATIVE_VERIFY_WORKSPACE: ${{ runner.temp }}/gnn-native-acceptance
          BACKEND: ${{ matrix.backend }}
        run: python verification/native_acceptance/provision.py --backend "$BACKEND"
      - name: Supervise controls and four full native replays
        env:
          GNN_NATIVE_VERIFY_WORKSPACE: ${{ runner.temp }}/gnn-native-acceptance
          BACKEND: ${{ matrix.backend }}
          EXPECTED_ROOT_HEAD: ${{ github.sha }}
        run: |
          "$GNN_NATIVE_VERIFY_WORKSPACE/py311/bin/python" -I \
            verification/native_acceptance/supervise.py \
            --backend "$BACKEND" --expected-root-head "$EXPECTED_ROOT_HEAD"
      - name: Retain raw current-run evidence, including partial failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reported-native-${{ matrix.backend }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gnn-native-acceptance/evidence/
            ${{ runner.temp }}/gnn-native-acceptance/wheels/
            ${{ runner.temp }}/gnn-native-acceptance/frozen-requirements.txt
            verification/native_acceptance/
            .github/workflows/gridworld.yml
          if-no-files-found: error
          retention-days: 14
