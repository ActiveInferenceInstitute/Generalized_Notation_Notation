# Pre-commit hooks for GNN Pipeline
# Install: uv run pre-commit install
# Run all: uv run pre-commit run --all-files
# See: https://pre-commit.com

repos:
  # ── Ruff: lint + format (matches pyproject.toml [tool.ruff]) ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        name: ruff lint
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        types_or: [python, pyi]

  # ── General file hygiene ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: debug-statements
        types: [python]

  # ── Repository terminology ──
  # The same command the `markdown-audit` job runs first, so a prohibited word
  # fails on the commit instead of after the push.
  - repo: local
    hooks:
      - id: repo-terminology
        name: repository terminology (strict)
        entry: python scripts/check_repo_terminology.py --strict
        language: python
        pass_filenames: false
        files: '^(src|docs|input|scripts|tests)/.*\.(py|md)$'
