# Preserve the configurable settings of protected pyproject.toml; uv.toml overrides configurable tool.uv options.
# Runtime exception/removal checks: README.md, Runtime defaults and required profiles.
# Floor, not equality: custody comes from `--frozen` and uv.lock, not from the
# tool that reads them. 0.13.6 is what CI installs; <0.14 admits host patch
# updates (0.13.7) while a new minor remains an explicit repository decision.
required-version = ">=0.13.6,<0.14"
# soupsieve is transitive (nbconvert -> beautifulsoup4). soupsieve 3.0.2+ and
# 4.x require Python >=3.11.5, so a single unmarked floor resolved one
# soupsieve for all interpreters and forced beautifulsoup4 back to 4.6.3
# (2018) on 3.11.0-3.11.4. beautifulsoup4 4.15.0 needs soupsieve>=1.6.1, so
# split the branch by marker; see pyproject.toml for the full rationale.
constraint-dependencies = ["fsspec>=2026.6.0", "gitpython>=3.1.58", "idna>=3.15", "jupyterlab>=4.6.4", "mistune>=3.3.0", "multidict>=6.9.1", "pillow>=13.0.0", "python-multipart>=0.0.27", "ray>=2.56.0", "setuptools>=83.0.0", "soupsieve>=4; python_full_version >= '3.11.5'", "soupsieve>=2.8.4,<4; python_full_version < '3.11.5'", "starlette>=1.0.1", "tornado>=6.5.9", "virtualenv>=21.14.13", "urllib3>=2.8.0"]

# Mirror pyproject.toml: supported GUI installs use uv, with the documented
# Gradio 6.30.0 / Pillow 13 metadata-cap exception and native GUI checks.
override-dependencies = ["pillow>=13.0.0"]
